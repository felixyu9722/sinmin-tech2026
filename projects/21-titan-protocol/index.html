<canvas id="cv"></canvas>
<div id="ov"><div>
<h1>TITAN PROTOCOL</h1><h2>泰坦协议 · 铁驭与机甲</h2>
<p><kbd>A</kbd><kbd>D</kbd> 移动 · <kbd>W</kbd>/<kbd>空格</kbd> 跳跃（铁驭可二段跳）· <kbd>S</kbd> 穿过平台</p>
<p><kbd>鼠标左键</kbd> 射击 · <kbd>鼠标右键</kbd> 浪人大剑（泰坦）· <kbd>R</kbd> 换弹 · <kbd>1</kbd><kbd>2</kbd><kbd>3</kbd> 切换武器</p>
<p><kbd>E</kbd> 泰坦能量 100% 时召唤 → 靠近再按 E 登入 / 在机甲内按 E 离开</p>
<p>击杀解锁：EVA-8 ×10 · Leadwall＋浪人剑 ×15 · 克莱贝尔 ×25 · 核心激光炮 ×35</p>
<div class="go">点击部署</div>
</div></div>
<script>
/* ================= 基础 ================= */
const cv=document.getElementById('cv'),ctx=cv.getContext('2d');
const VH=720,WW=3600,GY=640,GRAV=1800;let VW=1280,K=1,running=false;
function rs(){const d=Math.min(devicePixelRatio||1,2);cv.width=innerWidth*d;cv.height=innerHeight*d;VW=innerWidth*VH/innerHeight;K=cv.width/VW}
addEventListener('resize',rs);rs();
const R=Math.random,cl=(v,a,b)=>Math.max(a,Math.min(b,v));
const PL=[{x:480,y:500,w:260},{x:980,y:410,w:300},{x:1480,y:520,w:240},{x:1900,y:420,w:320},{x:2400,y:510,w:260},{x:2850,y:410,w:300},{x:3250,y:520,w:200}];
/* ---- 武器数据 ---- */
const WD={
 r201:{n:'R-201 突击步枪',dmg:16,rate:.09,mag:30,rl:1.5,sp:.035,auto:1,spd:1500,life:.7,col:'#7fe8ff'},
 eva8:{n:'EVA-8 散弹枪',dmg:11,rate:.7,mag:8,rl:2,sp:.16,pel:8,spd:1300,life:.3,col:'#ffe08a'},
 kraber:{n:'克莱贝尔 狙击枪',dmg:220,rate:1.3,mag:4,rl:2.4,sp:0,spd:3600,life:.5,pierce:1,col:'#ffffff'},
 cannon:{n:'40mm 自动炮',dmg:32,rate:.17,mag:40,rl:2.4,sp:.025,auto:1,spd:1500,life:.8,col:'#ffb347',big:1},
 leadwall:{n:'Leadwall 连发散弹',sub:'右键：浪人大剑',dmg:15,rate:.55,mag:8,rl:2.6,sp:.2,pel:9,spd:1300,life:.4,col:'#ff9d4d',big:1,burst:3},
 laser:{n:'核心激光炮',dmg:60,rate:.11,mag:60,rl:3,auto:1,beam:1,col:'#ff3d6e'}};
const PS=['r201','eva8','kraber'],TS=['cannon','leadwall','laser'],UL={eva8:10,leadwall:15,kraber:25,laser:35};
const ET={g:{n:'步兵 GRUNT',pts:100,core:4},s:{n:'潜行者 STALKER',pts:200,core:7},t:{n:'敌方泰坦 TITAN',pts:1000,core:35}};
/* ---- 背景装饰（固定种子）---- */
let sd=7;const rnd=()=>(sd=(sd*16807)%2147483647)/2147483647;
const STARS=Array.from({length:90},()=>({x:rnd()*2000,y:rnd()*380,s:rnd()*1.6+.4}));
const SK=Array.from({length:60},(_,i)=>({x:i*70+rnd()*30,w:30+rnd()*50,h:60+rnd()*230}));
const SK2=Array.from({length:40},(_,i)=>({x:i*110,w:50+rnd()*60,h:40+rnd()*140}));
/* ---- 状态 ---- */
let G,P,T,MG,jumpReq=false;const keys={},mouse={x:0,y:0,d:false,buf:0};
function init(){
 G={t:0,kills:0,score:0,combo:0,comboT:0,wave:0,over:false,shake:0,cam:0,en:[],bul:[],par:[],txt:[],feed:[],q:[],sc:0,waveT:1.5,banner:0,hit:0,mx:0,my:0,msg:'',msgT:0,red:0,got:{}};
 P={x:400,y:GY,vx:0,vy:0,w:26,h:54,hp:100,max:100,face:1,jc:0,mode:'pilot',cd:0,rl:0,sw:0,inv:0,regen:0,wi:0,ti:0,onG:true,core:0,ang:0,bq:null,fl:0};
 T=null;MG={};for(const k in WD)MG[k]=WD[k].mag}
const act=()=>P.mode==='titan'?T:P;
const un=id=>!UL[id]||G.kills>=UL[id];
const curId=()=>P.mode==='titan'?TS[P.ti]:PS[P.wi];
const note=s=>{G.msg=s;G.msgT=3};
/* ---- 音效 ---- */
let ac;function snd(f=200,t=.08,ty='square',v=.04){try{ac=ac||new AudioContext();const o=ac.createOscillator(),g=ac.createGain(),n=ac.currentTime;o.type=ty;o.frequency.setValueAtTime(f,n);o.frequency.exponentialRampToValueAtTime(40,n+t);g.gain.setValueAtTime(v,n);g.gain.exponentialRampToValueAtTime(.001,n+t);o.connect(g);g.connect(ac.destination);o.start();o.stop(n+t)}catch(e){}}
/* ================= 粒子 / 特效 ================= */
function sparks(x,y,n,col,spd=300,life=.4,g=600){for(let i=0;i<n;i++){const a=R()*6.283,v=spd*(.3+R());G.par.push({k:'p',x,y,vx:Math.cos(a)*v,vy:Math.sin(a)*v,life:life*(.5+R()),max:life,col,sz:1+R()*2.5,g})}}
const ring=(x,y,col,vr=500,life=.5,w=4)=>G.par.push({k:'r',x,y,r:8,vr,life,max:life,col,w});
function boomFx(x,y,s=1){sparks(x,y,26*s|0,'#ffb347',500*s,.7);sparks(x,y,14*s|0,'#ff4d2e',350*s,.9);sparks(x,y,10*s|0,'#555',250*s,1.2,300);ring(x,y,'#ffb347',420*s,.45,5);G.shake=Math.max(G.shake,8*s);snd(70,.35,'sawtooth',.07)}
/* ================= 物理 ================= */
function phys(a,dt){const py=a.y;a.vy+=GRAV*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;a.x=cl(a.x,a.w/2,WW-a.w/2);a.onG=false;
 if(a.vy>=0&&!a.drop)for(const p of PL)if(a.x+a.w/2>p.x&&a.x-a.w/2<p.x+p.w&&py<=p.y+1&&a.y>=p.y){a.y=p.y;a.vy=0;a.onG=true}
 if(a.y>=GY){a.y=GY;a.vy=0;a.onG=true}}
const ov=(e,a)=>Math.abs(e.x-a.x)<(e.w+a.w)/2&&e.y>a.y-a.h&&e.y-e.h<a.y;
const shoulder=a=>({x:a.x,y:a.y-(P.mode==='titan'&&a===T?78:36)});
/* ================= 玩家控制 ================= */
function ctl(dt){
 const a=act(),ti=P.mode==='titan',dir=(keys.KeyD?1:0)-(keys.KeyA?1:0),sp=ti?240:340;
 a.vx+=(dir*sp-a.vx)*Math.min(1,dt*(a.onG?14:5));a.drop=!!keys.KeyS;
 if(a.onG)a.jc=0;
 if(jumpReq){jumpReq=false;if(a.onG){a.vy=ti?-600:-680;a.jc=1;if(ti)sparks(a.x,a.y,8,'#aaa',200,.4)}else if(!ti&&a.jc<2){a.vy=-620;a.jc=2;sparks(a.x,a.y,12,'#35e0ff',260,.4);ring(a.x,a.y,'#35e0ff',260,.3,2);snd(500,.1,'sine')}}
 a.face=G.mx>a.x?1:-1;const s=shoulder(a);P.ang=Math.atan2(G.my-s.y,G.mx-s.x);
 phys(a,dt)}
function reload(){const id=curId(),w=WD[id];if(P.rl>0||MG[id]>=w.mag)return;P.rl=w.rl;P.rlId=id;P.bq=null}
function tryFire(){const id=curId(),w=WD[id];if(P.cd>0||P.rl>0||P.sw>.45)return false;
 if(MG[id]<=0){reload();return false}
 MG[id]--;P.cd=w.rate;volley(id);if(w.burst)P.bq={id,n:w.burst-1,t:.08};if(MG[id]<=0)reload();return true}
function volley(id){
 const w=WD[id],a=act(),ti=P.mode==='titan',s=shoulder(a),L=ti?62:30,ang=P.ang,mx=s.x+Math.cos(ang)*L,my=s.y+Math.sin(ang)*L;
 if(w.beam){const dx=Math.cos(ang),dy=Math.sin(ang);let len=1700;if(dy>.001)len=Math.min(len,(GY-my)/dy);
  for(const e of G.en){if(e.sp>0||e.dead)continue;const cx=e.x-mx,cy=e.y-e.h/2-my,t=cx*dx+cy*dy;if(t<0||t>len)continue;if(Math.abs(cx*dy-cy*dx)<Math.max(e.w*.6,e.h*.35))dmgE(e,w.dmg)}
  G.par.push({k:'b',x:mx,y:my,x2:mx+dx*len,y2:my+dy*len,life:.1,max:.1,col:w.col});sparks(mx+dx*len,my+dy*len,6,w.col,300,.3);G.shake=Math.max(G.shake,3);snd(900,.1,'sawtooth',.05);return}
 const n=w.pel||1;for(let i=0;i<n;i++){const an=ang+(R()-.5)*2*w.sp;G.bul.push({x:mx,y:my,vx:Math.cos(an)*w.spd,vy:Math.sin(an)*w.spd,dmg:w.dmg,life:w.life,team:0,pierce:w.pierce,hit:[],col:w.col,big:w.big})}
 sparks(mx,my,3,w.col,200,.15,0);a.vx-=Math.cos(ang)*(ti?15:25);G.shake=Math.max(G.shake,w.big?4:id==='kraber'?9:1.5);snd(id==='kraber'?90:ti?110:240,.09,'square',.05)}
function slash(){if(P.mode!=='titan'||!un('leadwall')||P.sw>0)return;P.sw=.7;const a=T;
 G.par.push({k:'a',x:a.x,y:a.y-70,face:a.face,r:30,vr:420,life:.22,max:.22});G.shake=Math.max(G.shake,6);snd(180,.15,'sawtooth',.06);
 for(const e of G.en){const d=(e.x-a.x)*a.face;if(e.sp<=0&&d>-30&&d<200&&e.y>a.y-150&&e.y-e.h<a.y){dmgE(e,260);e.vx+=a.face*500;sparks(e.x,e.y-e.h/2,12,'#ff9d4d',400,.4)}}}
function sw(i){const l=P.mode==='titan'?TS:PS,id=l[i];if(!un(id)){note(`未解锁：需击杀 ${UL[id]} 个敌人（当前 ${G.kills}）`);return}
 if(P.mode==='titan')P.ti=i;else P.wi=i;P.rl=0;P.cd=.25;P.bq=null}
function useE(){if(G.over)return;
 if(P.mode==='titan'){P.mode='pilot';P.x=T.x-T.face*70;P.y=T.y;P.vx=0;P.vy=-300;P.jc=1;T.state='idle';T.vx=0;P.rl=0;ring(T.x,T.y-50,'#35e0ff',350,.4);note('已离开泰坦');return}
 if(!T){if(P.core>=100){P.core=0;T={state:'warn',t:0,x:cl(P.x+P.face*260,150,WW-150),y:-300,vx:0,vy:0,w:64,h:116,hp:1600,max:1600,face:P.face,jc:0,fl:0,onG:false};note('泰坦空投中，保持距离！')}else note(`泰坦核心充能 ${Math.floor(P.core)}%`);return}
 if(T.state==='idle'&&Math.abs(P.x-T.x)<150&&P.y>T.y-170&&P.y-P.h<T.y){P.mode='titan';P.rl=0;P.bq=null;for(const id of TS)MG[id]=WD[id].mag;P.x=T.x;P.y=T.y;ring(T.x,T.y-50,'#35e0ff',500,.5,6);G.shake=10;snd(300,.3,'sine',.06);note('泰坦已登入 · 系统在线')}
 else if(T.state==='idle')note('靠近泰坦后按 E 登入');}
function eject(){boomFx(T.x,T.y-60,2.2);for(const e of G.en)if(e.sp<=0&&Math.hypot(e.x-T.x,e.y-T.y)<260)dmgE(e,400);
 P.mode='pilot';P.x=T.x;P.y=T.y-80;P.vx=0;P.vy=-950;P.inv=2;P.jc=1;P.rl=0;P.bq=null;T=null;P.core=0;G.red=.6;note('泰坦被击毁 · 弹射逃生！')}
function hurtP(d,heavy){if(P.inv>0||G.over)return;G.red=Math.min(.7,G.red+.2);P.regen=4;
 if(P.mode==='titan'){T.hp-=d*(heavy?1.2:.4);T.fl=.1;G.shake=Math.max(G.shake,heavy?10:3);if(T.hp<=0)eject()}
 else{P.hp-=d;P.fl=.1;G.shake=Math.max(G.shake,heavy?12:4);if(P.hp<=0){P.hp=0;G.over=true;boomFx(P.x,P.y-30,1.5)}}}
/* ================= 泰坦空投 ================= */
function updT(dt){if(!T)return;
 if(T.state==='warn'){T.t+=dt;if(T.t>1.4){T.state='fall';T.vy=500}}
 else if(T.state==='fall'){T.vy+=2800*dt;T.y+=T.vy*dt;if(T.y>=GY){T.y=GY;T.vy=0;T.state='idle';slam(T.x)}}
 else if(P.mode!=='titan'){T.vx*=.85;phys(T,dt)}}
function slam(x){G.shake=28;ring(x,GY,'#35e0ff',900,.7,8);ring(x,GY,'#ffffff',600,.5,4);sparks(x,GY,40,'#aee',600,.8);sparks(x,GY,20,'#ffb347',400,.8);snd(50,.5,'sawtooth',.09);
 for(const e of G.en){const d=Math.abs(e.x-x);if(d<320){dmgE(e,380*(1-d/340)+60);if(!e.dead){e.vx+=Math.sign(e.x-x)*500;e.vy=-350}}}
 if(P.mode==='pilot'&&Math.abs(P.x-x)<80&&P.y>GY-10)hurtP(60,true)}
/* ================= 敌人 ================= */
function spawnE(t){let x;for(let i=0;i<12;i++){x=200+R()*(WW-400);if(Math.abs(x-act().x)>650)break}
 const D={g:{w:28,h:54,hp:60},s:{w:34,h:52,hp:140},t:{w:84,h:140,hp:1400}}[t];
 G.en.push({t,x,y:GY,vx:0,vy:0,w:D.w,h:D.h,hp:D.hp,max:D.hp,face:1,cd:1+R(),lc:0,hc:0,sp:1.1,fl:0,onG:true,ang:0});ring(x,GY,'#ff4d6a',300,.6,3)}
function shootE(e,d,spd,spr,heavy,splash){const a=act(),sx=e.x,sy=e.y-e.h*.65,ang=Math.atan2(a.y-a.h/2-sy,a.x-sx)+(R()-.5)*spr,L=e.t==='t'?75:26;e.ang=ang;
 G.bul.push({x:sx+Math.cos(ang)*L,y:sy+Math.sin(ang)*L,vx:Math.cos(ang)*spd,vy:Math.sin(ang)*spd,dmg:d,life:2.5,team:1,heavy,splash,col:splash?'#ff7a2e':'#ff4d6a',big:!!splash});snd(splash?80:320,.12,'square',.03)}
function updE(e,dt){
 if(e.sp>0){e.sp-=dt;return}
 const a=act(),dx=a.x-e.x,ad=Math.abs(dx);e.face=dx>0?1:-1;e.cd-=dt;e.lc-=dt;e.hc-=dt;e.fl-=dt;
 if(e.t==='g'){const w=ad>520?1:ad<300?-1:0;e.vx=w*e.face*115;if(ad<950&&e.cd<=0){e.cd=1.1+R()*.8;shootE(e,7,650,.12,false)}else if(ad>=950)e.ang=e.face>0?0:Math.PI}
 else if(e.t==='s'){if(e.onG){e.vx=ad>40?e.face*250:0;if(ad<300&&ad>100&&e.lc<=0){e.vy=-560;e.vx=e.face*460;e.lc=2.2}}if(e.hc<=0&&ov(e,a)){hurtP(18,false);e.hc=.7}}
 else{const w=ad>700?1:ad<420?-1:0;e.vx=w*e.face*55;if(ad<1150&&e.cd<=0){e.cd=2.3;shootE(e,45,720,.05,true,110)}else if(ad>=1150)e.ang=e.face>0?0:Math.PI;if(e.hc<=0&&ad<90){hurtP(35,true);e.hc=1.2}}
 phys(e,dt)}
function dmgE(e,d){if(e.sp>0||e.dead)return;e.hp-=d;e.fl=.07;G.hit=.18;sparks(e.x,e.y-e.h*.5,4,'#ffd27a',260,.3);if(d>=40)G.txt.push({x:e.x,y:e.y-e.h-8,s:Math.round(d),life:.6});if(e.hp<=0)kill(e)}
function kill(e){e.dead=true;const D=ET[e.t];G.combo++;G.comboT=4;const m=1+Math.min(Math.floor((G.combo-1)/3),6)*.5,pts=Math.round(D.pts*m);G.score+=pts;G.kills++;if(!T)P.core=Math.min(100,P.core+D.core);
 G.feed.unshift({s:`击杀 ${D.n}  +${pts}${m>1?'  ×'+m.toFixed(1):''}`,life:2.6,col:e.t==='t'?'#ff8a1f':'#35e0ff'});G.feed.length=Math.min(G.feed.length,4);
 const big=e.t==='t'?2.4:e.t==='s'?.8:.6;boomFx(e.x,e.y-e.h/2,big);for(let i=0;i<8*big+4;i++)G.par.push({k:'p',x:e.x,y:e.y-e.h/2,vx:(R()-.5)*400,vy:-R()*500,life:1.2,max:1.2,col:'#333c4d',sz:3+R()*4,g:1200});
 for(const id in UL)if(!G.got[id]&&G.kills>=UL[id]){G.got[id]=1;note(`武器解锁：${WD[id].n}`);snd(800,.3,'sine',.07)}}
function waves(dt){if(G.q.length){G.sc-=dt;if(G.sc<=0&&G.en.length<6+G.wave){spawnE(G.q.pop());G.sc=.6}}else if(!G.en.length){G.waveT-=dt;if(G.waveT<=0)nextWave()}}
function nextWave(){const n=++G.wave,q=[];for(let i=0;i<3+n*2;i++)q.push('g');for(let i=0;i<Math.floor(n*1.3);i++)q.push('s');q.sort(()=>R()-.5);if(n%3===0)for(let i=0;i<Math.ceil(n/6);i++)q.push('t');G.q=q;G.sc=1;G.waveT=3;G.banner=3}
/* ================= 子弹 ================= */
function explode(b){boomFx(b.x,b.y,.7);const a=act(),d=Math.hypot(a.x-b.x,a.y-a.h/2-b.y);if(d<b.splash+a.w/2)hurtP(b.dmg*(1-d/(b.splash+a.w)),true)}
function bullets(dt){const a=act();
 for(const b of G.bul){const st=Math.ceil(Math.hypot(b.vx,b.vy)*dt/14),sx=b.vx*dt/st,sy=b.vy*dt/st;
  for(let i=0;i<st&&!b.dead;i++){b.x+=sx;b.y+=sy;
   if(b.y>=GY||b.x<0||b.x>WW){b.dead=true;if(b.splash)explode(b);else sparks(b.x,GY,4,b.col,200,.25);break}
   if(b.team===0){for(const e of G.en){if(e.dead||e.sp>0||b.hit.includes(e))continue;if(Math.abs(b.x-e.x)<e.w/2+3&&b.y>e.y-e.h-3&&b.y<e.y+3){dmgE(e,b.dmg);b.hit.push(e);if(!b.pierce){b.dead=true;break}}}}
   else if(Math.abs(b.x-a.x)<a.w/2+3&&b.y>a.y-a.h-3&&b.y<a.y+3){b.dead=true;if(b.splash)explode(b);else{hurtP(b.dmg,b.heavy);sparks(b.x,b.y,5,'#ff4d6a',200,.25)}}}
  b.life-=dt;if(b.life<=0&&!b.dead){b.dead=true;if(b.splash)explode(b)}
  if(b.splash&&!b.dead&&R()<.7)G.par.push({k:'p',x:b.x,y:b.y,vx:0,vy:0,life:.3,max:.3,col:'#ff7a2e',sz:3,g:0})}
