<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Protocol Explorer · 了解互联网如何运作</title>
    <meta
      name="description"
      content="交互式网络协议探索器（中学生精选版）：涵盖 TCP、UDP、IP、IPv6、ICMP、Wi-Fi、HTTP、WebSocket、DNS、DHCP、SMTP、POP3、IMAP、HTTPS、DoH、WPA3、SSH、TLS、WireGuard 共 19 个核心协议。"
    />
    <meta name="author" content="Dilum Sanjaya & AliShafiee2003" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fdfdfe" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#0b1020" media="(prefers-color-scheme: dark)" />
    <link rel="icon" href="./favicon.ico" sizes="16x16 32x32 48x48" />
    <link rel="icon" href="./favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./apple-touch-icon.png" />
    <link rel="manifest" href="./site.webmanifest" />
    <script>
      try {
        const saved = localStorage.getItem('protocol-explorer:theme')
        const dark = saved ? saved === 'dark' : false
        document.documentElement.dataset.theme = dark ? 'dark' : 'light'
      } catch {
        document.documentElement.dataset.theme = 'light'
      }
    </script>
    <link rel="stylesheet" href="./assets/index.css" />
    <script defer src="./assets/index.js"></script>
  </head>
  <body>
    <div id="app"></div>
  </body>
</html>
