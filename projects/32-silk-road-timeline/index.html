<title>丝绸之路 · 互动时间轴</title>
<style>
:root{color-scheme:light;--ink:#3b2a1a;--ink2:#6b4f33;--paper:#f3e4bf;--paper2:#e8d2a0;--red:#a8412a;--gold:#b98a2e;--sea:#cbd9d0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;color:var(--ink);font-family:"Noto Serif SC","Songti SC",SimSun,serif;line-height:1.7;
background:radial-gradient(ellipse at 20% 10%,#f8ecd0,transparent 60%),radial-gradient(ellipse at 90% 90%,#dcc28a,transparent 55%),var(--paper);min-height:100vh}
header{text-align:center;padding:22px 16px 6px}
h1{margin:0;font-size:clamp(24px,4vw,36px);letter-spacing:.15em;color:var(--red)}
header p{margin:4px 0 0;color:var(--ink2);font-size:15px}
.tl-wrap{position:relative;margin:10px auto 0;max-width:1100px;padding:0 8px}
.tl{display:flex;overflow-x:auto;padding:34px 24px 18px;gap:0;scroll-behavior:smooth;scrollbar-color:var(--gold) transparent}
.tl::before{content:"";position:absolute;left:8px;right:8px;top:58px;height:3px;background:repeating-linear-gradient(90deg,var(--ink2) 0 10px,transparent 10px 16px)}
.node{flex:0 0 150px;position:relative;background:none;border:0;font:inherit;color:inherit;cursor:pointer;text-align:center;padding:0 6px}
.dot{display:block;width:22px;height:22px;margin:0 auto 10px;border-radius:50%;background:var(--paper);border:3px solid var(--ink2);position:relative;z-index:1;transition:.25s}
.node:hover .dot{border-color:var(--red)}
.node.on .dot{background:var(--red);border-color:var(--red);box-shadow:0 0 0 6px rgba(168,65,42,.22);transform:scale(1.2)}
.yr{display:block;font-weight:700;font-size:16px;color:var(--red)}
.nm{display:block;font-size:14px;color:var(--ink2)}
.node.on .nm{color:var(--ink);font-weight:700}
.arrow{position:absolute;top:44px;z-index:2;width:34px;height:34px;border-radius:50%;border:2px solid var(--ink2);background:var(--paper);color:var(--ink);font-size:18px;cursor:pointer}
.arrow:hover{background:var(--paper2)}
#prev{left:-6px}#next{right:-6px}
main{max-width:1100px;margin:6px auto 30px;padding:0 14px;display:grid;grid-template-columns:minmax(260px,1fr) 1.7fr;gap:16px}
@media(max-width:800px){main{grid-template-columns:1fr}}
.card{background:linear-gradient(#f7ebcc,#efdcae);border:2px solid var(--ink2);border-radius:6px;padding:16px 18px;box-shadow:0 3px 0 rgba(107,79,51,.35),inset 0 0 30px rgba(185,138,46,.18)}
.card h2{margin:0 0 2px;font-size:22px}
.meta{color:var(--red);font-weight:700;font-size:15px;margin-bottom:8px}
.tag{display:inline-block;background:var(--ink2);color:#fbf1d6;border-radius:3px;padding:0 8px;font-size:13px;margin-right:6px}
.card p{margin:6px 0}
.impact{border-top:1px dashed var(--ink2);margin-top:10px;padding-top:8px}
.goods{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.chip{border:1.5px solid var(--ink2);border-radius:20px;padding:2px 10px;font-size:13px;background:#fbf1d6}
svg{width:100%;height:auto;display:block}
.land{fill:#efdcae;stroke:#a88a55;stroke-width:.8}
.reg path{stroke:#6b4f33;stroke-width:1;stroke-opacity:.6}
.reg text{font-size:11px;fill:#3b2a1a;text-anchor:middle;paint-order:stroke;stroke:#f3e4bf;stroke-width:3px;pointer-events:none;font-weight:700}
.reg tspan.en{font-size:9px;font-weight:400}
.lang{display:flex;gap:6px;justify-content:flex-end;margin-bottom:8px}.lang button{font:inherit;font-size:13px;border:1.5px solid var(--ink2);background:#fbf1d6;color:var(--ink);border-radius:14px;padding:1px 10px;cursor:pointer}.lang button.on{background:var(--red);color:#fff;border-color:var(--red)}
.sea{fill:var(--sea)}
.rt{fill:none;stroke:#a88a55;stroke-width:2.5;stroke-dasharray:6 5;opacity:.7}
.rt.sea-rt{stroke:#5a7f8a}
.rt.hl{stroke:var(--red);stroke-width:4;opacity:1}
.city circle{fill:var(--paper);stroke:var(--ink2);stroke-width:1.5;transition:.25s}
.city text{font-size:12px;fill:var(--ink2);font-family:inherit;display:none;paint-order:stroke;stroke:#f3e4bf;stroke-width:3px}
.city.hl circle{fill:var(--red);stroke:var(--red);r:6}
.city.hl text{display:block;fill:var(--red);font-weight:700;font-size:13px}
.pulse{fill:none;stroke:var(--red);stroke-width:2}
.flow{font-size:22px}
.legend{font-size:12px;fill:var(--ink2)}
.ext{max-width:1072px;margin:0 auto 24px}.ext h3{margin:4px 0 8px}.opt{display:block;width:100%;text-align:left;margin:6px 0;padding:8px 12px;font:inherit;border:1.5px solid var(--ink2);border-radius:6px;background:#fbf1d6;color:var(--ink);cursor:pointer}.opt:hover{background:var(--paper2)}.opt.ok{background:#cfe3b5}.opt.bad{background:#f0c3b6}.btn{font:inherit;border:1.5px solid var(--red);background:var(--red);color:#fff;border-radius:16px;padding:3px 16px;cursor:pointer;margin:6px 6px 0 0}.btn.alt{background:none;color:var(--red)}.gr{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:10px}.gc{border:1.5px solid var(--ink2);border-radius:6px;padding:8px 12px;background:#fbf1d6}.gc b{color:var(--red)}.mg{display:flex;flex-wrap:wrap;gap:8px;margin:6px 0}.mg .opt{width:auto;margin:0}.sel{outline:3px solid var(--gold)}.cmp{width:100%;border-collapse:collapse}.cmp td,.cmp th{border:1.5px solid var(--ink2);padding:6px 10px;vertical-align:top;text-align:left}.cmp th{background:var(--paper2)}
.mu{margin-top:8px;font:inherit;font-size:14px;border:1.5px solid var(--ink2);background:#fbf1d6;color:var(--ink);border-radius:16px;padding:3px 14px;cursor:pointer}.mu.on{background:var(--red);color:#fff;border-color:var(--red)}
footer{text-align:center;color:var(--ink2);font-size:13px;padding:0 14px 24px}
</style>

// 商品流动动画：沿事件路线移动小图标
function flow(e){
 cancelAnimationFrame(raf);
 const fl=document.getElementById("fl");fl.innerHTML="";
 const ns="http://www.w3.org/2000/svg";
 const pts=e.path.map(k=>P[k]);
 // 计算折线长度
 const seg=[];let L=0;
 for(let i=1;i<pts.length;i++){const d=Math.hypot(pts[i][0]-pts[i-1][0],pts[i][1]-pts[i-1][1]);seg.push(d);L+=d}
 const at=t=>{let s=t*L;for(let i=0;i<seg.length;i++){if(s<=seg[i]){const f=s/seg[i];return[pts[i][0]+(pts[i+1][0]-pts[i][0])*f,pts[i][1]+(pts[i+1][1]-pts[i][1])*f]}s-=seg[i]}return pts[pts.length-1]};
 // 每个货物：图标 + 方向（→ 向西流，← 向东流）
 const items=e.g.map((g,k)=>{
  const west=g.includes("→"), icon=[...g][0];
  const t=document.createElementNS(ns,"text");t.setAttribute("class","flow");t.textContent=icon;fl.appendChild(t);
  return{t,west,off:k/e.g.length}});
 const eastStart=pts[0][0]>pts[pts.length-1][0];
 const t0=performance.now();
 (function step(now){
  const base=((now-t0)/5000)%1;
  items.forEach(o=>{
   let p=(base+o.off)%1;
   // 以长安为东端：“→”代表丝路上由东向西，“←”由西向东（路线终点在西）
   p=(o.west===eastStart)?p:1-p;
   const [x,y]=at(p);o.t.setAttribute("x",x-11);o.t.setAttribute("y",y-8);
   o.t.setAttribute("opacity",Math.sin(Math.PI*p)*0.9+0.1);
  });
  raf=requestAnimationFrame(step);
 })(t0);
}

// ==================== 丝绸之路古风背景音乐自动播放与动态闪避系统 ====================
const bgmTracks = [
  { name: '丝路驼铃 (曲目一)', src: 'audio_track1.mp3' },
  { name: '丝路驼铃 (曲目二)', src: 'audio_track2.mp3' }
];
let currentBgmIndex = 0;
let bgmAudio = new Audio();
bgmAudio.src = bgmTracks[0].src;
bgmAudio.loop = false;
const NORMAL_BGM_VOL = 0.55;
const DUCK_BGM_VOL = 0.12; // 自动讲解时调至小声轻音乐 (0.12)
bgmAudio.volume = NORMAL_BGM_VOL;

let bgmFadeTimer = null;
function setBgmVolumeSmooth(targetVol, duration = 380) {
  if (!bgmAudio) return;
  clearInterval(bgmFadeTimer);
  const startVol = bgmAudio.volume;
  const startTime = performance.now();
  bgmFadeTimer = setInterval(() => {
    const elapsed = performance.now() - startTime;
    const p = Math.min(1, elapsed / duration);
    bgmAudio.volume = Math.max(0, Math.min(1, startVol + (targetVol - startVol) * p));
    if (p >= 1) {
      clearInterval(bgmFadeTimer);
      bgmAudio.volume = targetVol;
    }
  }, 25);
}

function duckBgmVolume() {
  setBgmVolumeSmooth(DUCK_BGM_VOL, 400);
}

function restoreBgmVolume() {
  setBgmVolumeSmooth(NORMAL_BGM_VOL, 450);
}

function updateBgmUI(isPlaying) {
  const icon = document.getElementById('bgm-icon');
  const title = document.getElementById('bgm-title');
  const btn = document.getElementById('bgm-toggle-btn');
  if (title) title.textContent = bgmTracks[currentBgmIndex].name;
  if (btn) btn.textContent = isPlaying ? '❚❚ 暂停' : '▶ 播放';
  if (icon) icon.style.opacity = isPlaying ? '1' : '0.5';
}

function playBgmTrack(index) {
  currentBgmIndex = index % bgmTracks.length;
  bgmAudio.src = bgmTracks[currentBgmIndex].src;
  bgmAudio.play().then(() => {
    updateBgmUI(true);
  }).catch(err => {
    console.log('Autoplay deferred:', err);
    updateBgmUI(false);
  });
}

bgmAudio.onended = () => {
  playBgmTrack((currentBgmIndex + 1) % bgmTracks.length);
};

function tryAutoPlayBgm() {
  bgmAudio.play().then(() => {
    updateBgmUI(true);
  }).catch(() => {
    updateBgmUI(false);
    const resumeOnInteraction = () => {
      bgmAudio.play().then(() => {
        updateBgmUI(true);
      }).catch(e => console.log(e));
      window.removeEventListener('click', resumeOnInteraction);
      window.removeEventListener('keydown', resumeOnInteraction);
      window.removeEventListener('touchstart', resumeOnInteraction);
    };
    window.addEventListener('click', resumeOnInteraction, { once: true });
    window.addEventListener('keydown', resumeOnInteraction, { once: true });
    window.addEventListener('touchstart', resumeOnInteraction, { once: true });
  });
}

window.addEventListener('DOMContentLoaded', tryAutoPlayBgm);

document.addEventListener('DOMContentLoaded', () => {
  const toggleBtn = document.getElementById('bgm-toggle-btn');
  const icon = document.getElementById('bgm-icon');
  const title = document.getElementById('bgm-title');
  const nextBtn = document.getElementById('bgm-next-btn');

  const toggle = () => {
    if (bgmAudio.paused) {
      bgmAudio.play();
      updateBgmUI(true);
    } else {
      bgmAudio.pause();
      updateBgmUI(false);
    }
  };

  if (toggleBtn) toggleBtn.onclick = toggle;
  if (icon) icon.onclick = toggle;
  if (title) title.onclick = () => playBgmTrack((currentBgmIndex + 1) % bgmTracks.length);
  if (nextBtn) nextBtn.onclick = () => playBgmTrack((currentBgmIndex + 1) % bgmTracks.length);
});

// ===== 自动语音讲解 (含配乐智能闪避降噪) =====
(()=>{
  const b = document.getElementById('ap');
  const S = window.speechSynthesis;
  let run = false, tm = null, tok = 0;

  const stop = () => {
    run = false;
    tok++;
    clearTimeout(tm);
    S && S.cancel();
    b.classList.remove('on');
    b.textContent = '▶ 自动讲解（语音）';
    // 讲解停止或结束时，配乐平滑恢复正常音量
    restoreBgmVolume();
  };

  const speak = () => {
    if (!run) return;
    const id = ++tok;
    const e = E[cur];
    const txt = `${e.y}，${e.n}。${e.pl.replace(/ /g, '、')}。${e.d} 意义：${e.i}`;

    const next = () => {
      if (!run || id !== tok) return;
      if (cur >= E.length - 1) return stop();
      show(cur + 1);
      speak();
    };

    if (!S) {
      tm = setTimeout(next, 8000);
      return;
    }

    S.cancel();
    const u = new SpeechSynthesisUtterance(txt);
    u.lang = 'zh-CN';
    u.rate = 0.95;
    const v = S.getVoices().find(v => /zh|cmn/i.test(v.lang));
    if (v) u.voice = v;

    u.onend = () => {
      if (id === tok) tm = setTimeout(next, 800);
    };
    u.onerror = () => {
      if (id === tok) tm = setTimeout(next, 6000);
    };
    S.speak(u);
  };

  b.onclick = () => {
    if (run) return stop();
    run = true;
    b.classList.add('on');
    b.textContent = '⏹ 停止讲解';
    // 点击自动讲解时，配乐自动调整小声！
    duckBgmVolume();
    if (cur < 0 || cur >= E.length - 1) show(0);
    speak();
  };

  // 用户点击时间轴切换时，停止当前讲解并恢复配乐
  const tlEl = document.getElementById('tl');
  if (tlEl) {
    tlEl.addEventListener('click', () => {
      if (run) stop();
    });
  }
})();

show(0);
</script>
