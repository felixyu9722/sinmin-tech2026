<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>古诗词意境画卷教学页 · 水墨有声版</title>
  <style>
    /* ==========================================================================
       1. CSS 变量与东方美学配色系统 (支持浅色宣纸与深色夜读模式)
       ========================================================================== */
    :root {
      --bg-color: #f4efe6;
      --paper-texture: #e5dec9;
      --text-main: #22201e;
      --text-muted: #665f57;
      --ink-black: #181715;
      --ink-accent: #9b2922; /* 朱砂印泥红 */
      --ink-accent-hover: #b8322a;
      --jade-green: #2c6e58; /* 青玉色 */
      --gold-accent: #b58938;
      --card-bg: rgba(250, 247, 240, 0.86);
      --card-border: #d2c8b4;
      --focus-ring: #9b2922;
      --particle-color: rgba(30, 30, 30, 0.28);
      --ink-wash-alpha: 0.08;
      --shadow-soft: 0 10px 30px rgba(45, 38, 28, 0.08);
      --transition-speed: 0.3s;
    }

    [data-theme="dark"] {
      --bg-color: #12151a;
      --paper-texture: #1b2028;
      --text-main: #e8e4dc;
      --text-muted: #9aa0a8;
      --ink-black: #f2efe9;
      --ink-accent: #e05347;
      --ink-accent-hover: #f5695d;
      --jade-green: #48a888;
      --gold-accent: #deb05a;
      --card-bg: rgba(24, 28, 36, 0.86);
      --card-border: #303744;
      --focus-ring: #e05347;
      --particle-color: rgba(255, 255, 255, 0.32);
      --ink-wash-alpha: 0.14;
      --shadow-soft: 0 10px 30px rgba(0, 0, 0, 0.35);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      font-family: "STKaiti", "Kaiti SC", "KaiTi", "FangSong", "SimSun", serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      line-height: 1.65;
      overflow-x: hidden;
      min-height: 100vh;
      position: relative;
      transition: background-color 0.4s ease, color 0.4s ease;
      background-image: 
        radial-gradient(var(--paper-texture) 1px, transparent 0),
        radial-gradient(var(--paper-texture) 1px, transparent 0);
      background-size: 32px 32px;
      background-position: 0 0, 16px 16px;
    }

    /* 全屏动态水墨流动背景 Canvas */
    #inkBgCanvas {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      z-index: 0;
      pointer-events: none;
    }

    /* 无障碍焦点框 */
    :focus-visible {
      outline: 3px solid var(--focus-ring);
      outline-offset: 3px;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 1240px;
      margin: 0 auto;
      padding: 16px 24px 48px;
    }

    /* 顶部栏与全局工具条 */
    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 12px;
      padding: 12px 0;
      border-bottom: 1px solid var(--card-border);
      margin-bottom: 16px;
    }

    .brand-header {
      display: flex;
      align-items: center;
      gap: 14px;
    }

    /* 传统朱砂印章标志 */
    .seal-stamp {
      width: 44px;
      height: 44px;
      background-color: var(--ink-accent);
      color: #fff;
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
      font-size: 0.95rem;
      line-height: 1.1;
      letter-spacing: 1px;
      text-align: center;
      box-shadow: inset 0 0 0 2px rgba(255,255,255,0.25), 0 3px 8px rgba(155, 41, 34, 0.3);
      user-select: none;
      flex-shrink: 0;
    }

    .brand-title h1 {
      font-size: 1.95rem;
      color: var(--ink-black);
      letter-spacing: 3px;
    }

    .brand-title p {
      font-size: 0.92rem;
      color: var(--text-muted);
    }

    .global-tools {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      align-items: center;
    }

    .tool-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 6px 13px;
      border-radius: 20px;
      font-family: inherit;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 6px;
      transition: all 0.25s ease;
      box-shadow: 0 2px 6px rgba(0,0,0,0.03);
    }

    .tool-btn:hover {
      border-color: var(--ink-accent);
      color: var(--ink-accent);
      transform: translateY(-1px);
    }

    .tool-btn.active {
      background: var(--ink-accent);
      color: #ffffff;
      border-color: var(--ink-accent);
    }

    /* 场景导航选项卡 */
    .nav-tabs {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin: 14px 0 18px;
    }

    .tab-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 7px 15px;
      font-size: 0.95rem;
      font-family: inherit;
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      transition: all var(--transition-speed) ease;
      backdrop-filter: blur(4px);
    }

    .tab-btn:hover {
      border-color: var(--ink-accent);
      transform: translateY(-2px);
    }

    .tab-btn.active {
      background: var(--ink-accent);
      color: #ffffff;
      border-color: var(--ink-accent);
      box-shadow: 0 4px 12px rgba(155, 41, 34, 0.28);
    }

    /* 画卷视差展示区 */
    .scroll-stage-wrapper {
      position: relative;
      margin-bottom: 22px;
    }

    .scroll-stage {
      position: relative;
      width: 100%;
      height: 390px;
      border-radius: 12px;
      overflow: hidden;
      border: 2px solid var(--card-border);
      box-shadow: var(--shadow-soft);
      background: var(--paper-texture);
    }

    /* 卷轴左右装饰画轴感 */
    .scroll-stage::before,
    .scroll-stage::after {
      content: "";
      position: absolute;
      top: 0;
      bottom: 0;
      width: 10px;
      background: linear-gradient(90deg, rgba(60,40,20,0.35), transparent);
      z-index: 6;
      pointer-events: none;
    }
    .scroll-stage::after {
      right: 0;
      background: linear-gradient(-90deg, rgba(60,40,20,0.35), transparent);
    }

    .parallax-layer {
      position: absolute;
      top: -4%;
      left: -4%;
      width: 108%;
      height: 108%;
      pointer-events: none;
      transition: transform 0.15s ease-out, opacity 0.5s ease;
    }

    /* 网页精选意境配图 / 自定义上传图片层 */
    #customImageLayer {
      position: absolute;
      top: -3%;
      left: -3%;
      width: 106%;
      height: 106%;
      background-size: cover;
      background-position: center;
      transition: transform 0.2s ease-out, opacity 0.6s ease;
      opacity: 0;
      pointer-events: none;
      z-index: 1;
    }

    /* 水墨宣纸遮罩让实景照片融入水墨古风 */
    #customImageLayer::after {
      content: "";
      position: absolute;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(18, 20, 24, 0.45) 100%);
    }

    #particleCanvas {
      position: absolute;
      top: 0;
      left: 0;
      width: 100%;
      height: 100%;
      pointer-events: none;
      z-index: 4;
    }

    /* 画卷内的书法水印与印章 */
    .stage-watermark {
      position: absolute;
      top: 22px;
      left: 28px;
      z-index: 5;
      pointer-events: none;
      display: flex;
      align-items: flex-start;
      gap: 12px;
      background: rgba(250, 247, 240, 0.72);
      padding: 10px 16px;
      border-radius: 8px;
      backdrop-filter: blur(6px);
      border: 1px solid rgba(155, 41, 34, 0.2);
      color: #1f1d1a;
      box-shadow: 0 4px 15px rgba(0,0,0,0.08);
    }

    .stage-watermark-text {
      writing-mode: vertical-rl;
      font-size: 1.25rem;
      letter-spacing: 4px;
      font-weight: bold;
      max-height: 150px;
    }

    .stage-watermark-seal {
      width: 24px;
      height: 24px;
      background: #9b2922;
      color: #fff;
      font-size: 0.7rem;
      display: flex;
      align-items: center;
      justify-content: center;
      border-radius: 3px;
      margin-top: auto;
    }

    /* 画卷右下角图源切换悬浮栏 */
    .stage-toolbar {
      position: absolute;
      bottom: 14px;
      right: 16px;
      z-index: 7;
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      background: rgba(25, 28, 34, 0.72);
      backdrop-filter: blur(8px);
      padding: 6px 10px;
      border-radius: 30px;
      border: 1px solid rgba(255,255,255,0.18);
    }

    .stage-mode-btn {
      background: transparent;
      border: none;
      color: #e5e0d8;
      font-family: inherit;
      font-size: 0.85rem;
      padding: 4px 11px;
      border-radius: 18px;
      cursor: pointer;
      transition: all 0.2s;
    }

    .stage-mode-btn:hover {
      color: #ffffff;
      background: rgba(255,255,255,0.12);
    }

    .stage-mode-btn.active {
      background: var(--ink-accent);
      color: #ffffff;
    }

    /* 自定义图片抽屉栏 */
    .custom-img-drawer {
      display: none;
      margin-top: 10px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 8px;
      padding: 12px 16px;
      align-items: center;
      justify-content: space-between;
      flex-wrap: wrap;
      gap: 12px;
      backdrop-filter: blur(8px);
    }

    .custom-img-drawer.show {
      display: flex;
    }

    .img-input-group {
      display: flex;
      gap: 8px;
      flex: 1;
      min-width: 260px;
    }

    .img-url-input {
      flex: 1;
      padding: 7px 12px;
      border: 1px solid var(--card-border);
      border-radius: 6px;
      background: var(--bg-color);
      color: var(--text-main);
      font-family: inherit;
      font-size: 0.9rem;
    }

    .file-upload-label {
      background: var(--jade-green);
      color: #fff;
      padding: 7px 14px;
      border-radius: 6px;
      font-size: 0.9rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      transition: opacity 0.2s;
    }

    .file-upload-label:hover {
      opacity: 0.9;
    }

    /* 诗词与讲解主栅格区 */
    .content-grid {
      display: grid;
      grid-template-columns: 1fr;
      gap: 22px;
    }

    @media (min-width: 860px) {
      .content-grid {
        grid-template-columns: 1.35fr 1fr;
      }
    }

    @media (max-width: 768px) {
      .container {
        padding: 10px 12px !important;
      }
      .scroll-stage {
        height: 240px !important;
      }
      .nav-tabs {
        padding: 4px 2px !important;
        gap: 6px !important;
      }
      .tab-btn {
        padding: 5px 9px !important;
        font-size: 0.78rem !important;
      }
      .poem-card, .info-card, .quiz-card {
        padding: 15px !important;
      }
      .stage-watermark {
        font-size: 13px !important;
        top: 10px !important;
        left: 12px !important;
      }
    }

    @media (max-width: 480px) {
      .scroll-stage {
        height: 195px !important;
      }
      .logo-title {
        font-size: 1.15rem !important;
      }
      .logo-subtitle {
        font-size: 0.7rem !important;
      }
      .header-controls .btn-sound, .header-controls .home-btn {
        padding: 5px 8px !important;
        font-size: 0.75rem !important;
      }
    }

    .poem-card, .info-card, .quiz-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 10px;
      padding: 24px;
      backdrop-filter: blur(8px);
      box-shadow: var(--shadow-soft);
    }

    .poem-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 16px;
      border-bottom: 1px dashed var(--card-border);
      padding-bottom: 12px;
    }

    .poem-title-group {
      display: flex;
      align-items: baseline;
      gap: 12px;
    }

    .poem-title {
      font-size: 1.9rem;
      color: var(--ink-black);
      letter-spacing: 2px;
    }

    .poem-meta {
      color: var(--ink-accent);
      font-size: 1rem;
      font-weight: bold;
    }

    /* 诗词正文容器：支持横排与竖排古籍切换 */
    .poem-body-wrap {
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 220px;
      padding: 12px 0;
    }

    .poem-body {
      font-size: 1.55rem;
      line-height: 2.3;
      text-align: center;
      transition: all 0.3s ease;
    }

    /* 古籍竖排模式 */
    .poem-body.vertical-mode {
      writing-mode: vertical-rl;
      text-orientation: upright;
      height: 290px;
      line-height: 2.6;
      text-align: start;
      border-right: 2px solid var(--ink-accent);
      padding-right: 16px;
    }

    .poem-line {
      margin-bottom: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      gap: 4px;
    }

    .poem-body.vertical-mode .poem-line {
      margin-bottom: 0;
      margin-left: 18px;
      flex-wrap: nowrap;
      border-left: 1px dashed var(--card-border);
      padding-left: 10px;
    }

    .word-token {
      display: inline-block;
      padding: 4px 8px;
      border-radius: 6px;
      cursor: pointer;
      transition: background-color 0.2s, color 0.2s, transform 0.2s;
      border: 1px solid transparent;
      position: relative;
    }

    .word-token:hover {
      background-color: rgba(155, 41, 34, 0.12);
      border-color: var(--ink-accent);
      transform: translateY(-2px);
    }

    .word-token.highlight {
      background-color: var(--ink-accent);
      color: #ffffff;
      transform: scale(1.08);
      box-shadow: 0 4px 12px rgba(155, 41, 34, 0.35);
    }

    .word-token.highlight rt {
      color: #ffe5e0;
    }

    /* 拼音注音样式 */
    ruby {
      ruby-align: center;
    }

    rt {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      font-size: 0.72rem;
      color: var(--text-muted);
      font-weight: normal;
      letter-spacing: 0;
      transform: translateY(-2px);
    }

    .hide-pinyin rt {
      display: none;
    }

    .punctuation {
      color: var(--text-muted);
      user-select: none;
      padding: 0 2px;
    }

    /* 朗读与音频控制区 */
    .controls-bar {
      display: flex;
      gap: 10px;
      justify-content: center;
      align-items: center;
      flex-wrap: wrap;
      margin-top: 16px;
      padding-top: 14px;
      border-top: 1px dashed var(--card-border);
    }

    .action-btn {
      background: var(--ink-black);
      color: var(--bg-color);
      border: none;
      padding: 9px 18px;
      font-size: 0.96rem;
      font-family: inherit;
      border-radius: 6px;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      gap: 7px;
      transition: all 0.25s ease;
    }

    .action-btn:hover {
      background: var(--ink-accent);
      color: #ffffff;
      transform: translateY(-1px);
    }

    .action-btn.reading-active {
      background: var(--ink-accent);
      color: #ffffff;
      animation: gentlePulse 1.5s infinite;
    }

    .action-btn.secondary {
      background: transparent;
      color: var(--text-main);
      border: 1px solid var(--card-border);
    }

    .action-btn.secondary:hover {
      border-color: var(--ink-accent);
      color: var(--ink-accent);
      background: transparent;
    }

    @keyframes gentlePulse {
      0%, 100% { box-shadow: 0 0 0 0 rgba(155, 41, 34, 0.45); }
      50% { box-shadow: 0 0 0 8px rgba(155, 41, 34, 0); }
    }

    /* 右侧：多功能赏析卡片 */
    .info-tabs {
      display: flex;
      gap: 6px;
      border-bottom: 1px solid var(--card-border);
      padding-bottom: 10px;
      margin-bottom: 14px;
    }

    .info-tab-btn {
      background: transparent;
      border: none;
      font-family: inherit;
      font-size: 0.95rem;
      color: var(--text-muted);
      padding: 5px 12px;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: all 0.2s;
    }

    .info-tab-btn.active {
      background: rgba(155, 41, 34, 0.12);
      color: var(--ink-accent);
    }

    .annotation-box {
      min-height: 110px;
      padding: 12px 14px;
      background: rgba(0, 0, 0, 0.025);
      border-left: 3px solid var(--ink-accent);
      border-radius: 0 6px 6px 0;
    }

    .speak-word-btn {
      background: none;
      border: 1px solid var(--card-border);
      color: var(--ink-accent);
      border-radius: 14px;
      padding: 2px 9px;
      font-size: 0.8rem;
      cursor: pointer;
      margin-left: 8px;
      font-family: inherit;
    }

    .speak-word-btn:hover {
      background: var(--ink-accent);
      color: #fff;
    }

    .imagery-tags {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .imagery-tag {
      font-size: 0.85rem;
      padding: 3px 10px;
      border-radius: 14px;
      background: rgba(44, 110, 88, 0.12);
      color: var(--jade-green);
      border: 1px solid rgba(44, 110, 88, 0.25);
    }

    .translation-text {
      font-size: 1.02rem;
      color: var(--text-main);
      margin-top: 14px;
      padding-top: 14px;
      border-top: 1px dashed var(--card-border);
      line-height: 1.75;
    }

    /* 互动闯关区 */
    .quiz-card {
      margin-top: 22px;
    }

    .quiz-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      margin-bottom: 12px;
    }

    .quiz-title-wrap {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .quiz-title {
      color: var(--ink-accent);
      font-size: 1.25rem;
    }

    .quiz-score-badge {
      background: rgba(181, 137, 56, 0.15);
      color: var(--gold-accent);
      border: 1px solid rgba(181, 137, 56, 0.35);
      padding: 3px 12px;
      border-radius: 20px;
      font-size: 0.88rem;
      font-weight: bold;
    }

    .quiz-question {
      font-size: 1.35rem;
      text-align: center;
      margin: 18px 0;
      letter-spacing: 2px;
      padding: 12px;
      background: rgba(0,0,0,0.02);
      border-radius: 8px;
    }

    .quiz-options {
      display: flex;
      justify-content: center;
      gap: 12px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .option-btn {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 10px 24px;
      font-size: 1.1rem;
      font-family: inherit;
      color: var(--text-main);
      border-radius: 6px;
      cursor: pointer;
      transition: all var(--transition-speed);
    }

    .option-btn:hover {
      border-color: var(--ink-accent);
      background-color: var(--paper-texture);
      transform: translateY(-2px);
    }

    .quiz-feedback {
      text-align: center;
      margin-top: 14px;
      font-size: 1.02rem;
      font-weight: bold;
      min-height: 26px;
    }

    /* 尊重减少动效配置 */
    @media (prefers-reduced-motion: reduce) {
      *, .word-token, .tab-btn, .parallax-layer {
        animation: none !important;
        transition: none !important;
      }
    }
  </style>
</head>
<body>

  <!-- 全屏动态水墨晕染与流云背景 Canvas -->
  <canvas id="inkBgCanvas" aria-hidden="true"></canvas>

  <!-- 隐藏的全局 SVG 滤镜库：提供水墨毛边晕染效果 -->
  <svg width="0" height="0" style="position:absolute">
    <defs>
      <filter id="ink-bleed" x="-10%" y="-10%" width="120%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.025" numOctaves="3" result="noise" />
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="12" xChannelSelector="R" yChannelSelector="G" />
      </filter>
      <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
        <feGaussianBlur stdDeviation="6" result="blur" />
        <feComposite in="SourceGraphic" in2="blur" operator="over" />
      </filter>
    </defs>
  </svg>

  <div class="container">
    <!-- 顶部品牌与全局教学工具条 -->
    <header class="top-bar" role="banner">
      <div class="brand-header">
        <div class="seal-stamp" aria-hidden="true">诗画<br>雅集</div>
        <div class="brand-title">
          <h1>古诗词意境画卷</h1>
          <p>水墨流动 · 真声吟诵 · 点击字词查看注解与赏析</p>
        </div>
      </div>

            <rect width="800" height="400" fill="#141923"/>
            <circle cx="180" cy="145" r="28" fill="#e8ecf2" opacity="0.38"/>
          </svg>`,
          svgMid: `<svg width="100%" height="100%" viewBox="0 0 800 400" preserveAspectRatio="none">
            <path filter="url(#ink-bleed)" d="M0 290 Q300 200 600 300 T800 270 L800 400 L0 400 Z" fill="#20293a" opacity="0.85"/>
          </svg>`,
          svgFore: `<svg width="100%" height="100%" viewBox="0 0 800 400" preserveAspectRatio="none">
            <path d="M0 365 Q400 325 800 365 L800 400 L0 400 Z" fill="#0b0e14"/>
            <path d="M470 350 Q515 362 560 348 Z" fill="#1a2230"/>
            <circle cx="520" cy="344" r="4.5" fill="#ffaa44" filter="url(#soft-glow)"/>
          </svg>`
        }
      ]
    };

    /* ==========================================================================
       2. 状态管理区 (State Management)
       ========================================================================== */
    const state = {
      currentIndex: 0,
      isReading: false,
      readTimer: null,
      showPinyin: true,
      isVertical: false,
      visualMode: 'ink', // 'ink' | 'curated' | 'custom'
      customImages: {},  // 保存用户按诗定制的图片 URL/DataURL
      autoInkTimer: null,
      lastMouseInkTime: 0,
      particles: [],
      inkBlots: [],
      inkClouds: [],
      quizMode: 'word',  // 'word' | 'line'
      quizAnswer: '',
      quizStreak: 0,
      quizScore: 0
    };

    /* ==========================================================================
       3. 全屏动态水墨画流动背景引擎 (#inkBgCanvas) - 全自动点墨晕染
       ========================================================================== */
    const inkBgCanvas = document.getElementById('inkBgCanvas');
    const inkCtx = inkBgCanvas.getContext('2d');

    function initInkBg() {
      inkBgCanvas.width = window.innerWidth;
      inkBgCanvas.height = window.innerHeight;

      // 初始化流动水墨云气与墨团
      state.inkClouds = [];
      for (let i = 0; i < 10; i++) {
        state.inkClouds.push({
          x: Math.random() * inkBgCanvas.width,
          y: Math.random() * inkBgCanvas.height,
          radius: Math.random() * 240 + 150,
          vx: (Math.random() - 0.5) * 0.4,
          vy: (Math.random() - 0.5) * 0.2,
          phase: Math.random() * Math.PI * 2
        });
      }

      // 初始自动晕开3处水墨
      for (let i = 0; i < 3; i++) {
        spawnInkBlot();
      }

      // 开启全自动定时点墨晕染（无需手动点击，自然间隔滴落浓淡墨滴）
      if (state.autoInkTimer) clearInterval(state.autoInkTimer);
      state.autoInkTimer = setInterval(() => {
        if (!document.hidden) {
          spawnInkBlot();
          // 偶发双墨交融效果
          if (Math.random() > 0.55) {
            setTimeout(() => spawnInkBlot(), 700);
          }
        }
      }, 2800);
    }

    // 触发一滴水墨在宣纸上自然多层晕染散开
    function spawnInkBlot(x, y, maxRadius = 135) {
      const targetX = x ?? (Math.random() * inkBgCanvas.width * 0.86 + inkBgCanvas.width * 0.07);
      const targetY = y ?? (Math.random() * inkBgCanvas.height * 0.86 + inkBgCanvas.height * 0.07);

      state.inkBlots.push({
        x: targetX,
        y: targetY,
        r: 5,
        maxR: maxRadius + Math.random() * 75,
        alpha: 0.13 + Math.random() * 0.05,
        rotation: Math.random() * Math.PI * 2,
        rotSpeed: (Math.random() - 0.5) * 0.002,
        lobes: Array.from({ length: 9 }, () => Math.random() * 0.34 + 0.82)
      });
      if (state.inkBlots.length > 14) state.inkBlots.shift();
    }

    function animateInkBackground() {
      inkCtx.clearRect(0, 0, inkBgCanvas.width, inkBgCanvas.height);
      const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
      const inkRGB = isDark ? '200, 210, 225' : '32, 35, 40';

      // 1. 绘制远山双层流动水墨气韵
      const time = Date.now() * 0.00045;
      inkCtx.save();
      inkCtx.beginPath();
      inkCtx.moveTo(0, inkBgCanvas.height);
      for (let x = 0; x <= inkBgCanvas.width; x += 36) {
        const y = inkBgCanvas.height * 0.76 +
          Math.sin(x * 0.0028 + time) * 48 +
          Math.cos(x * 0.0065 - time * 0.8) * 30;
        inkCtx.lineTo(x, y);
      }
      inkCtx.lineTo(inkBgCanvas.width, inkBgCanvas.height);
      inkCtx.closePath();
      const gradMountain = inkCtx.createLinearGradient(0, inkBgCanvas.height * 0.62, 0, inkBgCanvas.height);
      gradMountain.addColorStop(0, `rgba(${inkRGB}, 0.055)`);
      gradMountain.addColorStop(1, `rgba(${inkRGB}, 0.012)`);
      inkCtx.fillStyle = gradMountain;
      inkCtx.fill();
      inkCtx.restore();

      // 2. 绘制缓缓流动的水墨云烟
      state.inkClouds.forEach(c => {
        c.x += c.vx;
        c.y += c.vy;
        c.phase += 0.005;

        if (c.x < -c.radius) c.x = inkBgCanvas.width + c.radius;
        if (c.x > inkBgCanvas.width + c.radius) c.x = -c.radius;
        if (c.y < -c.radius) c.y = inkBgCanvas.height + c.radius;
        if (c.y > inkBgCanvas.height + c.radius) c.y = -c.radius;

        const pulseR = c.radius + Math.sin(c.phase) * 24;
        const g = inkCtx.createRadialGradient(c.x, c.y, pulseR * 0.1, c.x, c.y, pulseR);
        g.addColorStop(0, `rgba(${inkRGB}, 0.048)`);
        g.addColorStop(0.6, `rgba(${inkRGB}, 0.02)`);
        g.addColorStop(1, `rgba(${inkRGB}, 0)`);

        inkCtx.fillStyle = g;
        inkCtx.beginPath();
        inkCtx.arc(c.x, c.y, pulseR, 0, Math.PI * 2);
        inkCtx.fill();
      });

      // 3. 绘制自动扩散的水墨晕染墨滴
      for (let i = state.inkBlots.length - 1; i >= 0; i--) {
        const b = state.inkBlots[i];
        b.r += (b.maxR - b.r) * 0.018;
        b.alpha *= 0.995;
        b.rotation += b.rotSpeed;

        if (b.alpha < 0.003) {
          state.inkBlots.splice(i, 1);
          continue;
        }

        inkCtx.save();
        inkCtx.translate(b.x, b.y);
        inkCtx.rotate(b.rotation);
        const g = inkCtx.createRadialGradient(0, 0, b.r * 0.08, 0, 0, b.r);
        g.addColorStop(0, `rgba(${inkRGB}, ${b.alpha})`);
        g.addColorStop(0.65, `rgba(${inkRGB}, ${b.alpha * 0.55})`);
        g.addColorStop(0.9, `rgba(${inkRGB}, ${b.alpha * 0.25})`);
        g.addColorStop(1, `rgba(${inkRGB}, 0)`);
        inkCtx.fillStyle = g;

        inkCtx.beginPath();
        const steps = 32;
        for (let s = 0; s <= steps; s++) {
          const angle = (s / steps) * Math.PI * 2;
          const lobeFactor = b.lobes[s % b.lobes.length];
          const rad = b.r * lobeFactor;
          const px = Math.cos(angle) * rad;
          const py = Math.sin(angle) * rad;
          if (s === 0) inkCtx.moveTo(px, py);
          else inkCtx.lineTo(px, py);
        }
        inkCtx.closePath();
        inkCtx.fill();
        inkCtx.restore();
      }

      requestAnimationFrame(animateInkBackground);
    }

    /* ==========================================================================
       4. 画卷前景意境粒子渲染 (#particleCanvas)
       ========================================================================== */
    const canvas = document.getElementById('particleCanvas');
    const ctx = canvas.getContext('2d');

    function resizeCanvas() {
      const stage = document.getElementById('scrollStage');
      canvas.width = stage.clientWidth;
      canvas.height = stage.clientHeight;
      inkBgCanvas.width = window.innerWidth;
      inkBgCanvas.height = window.innerHeight;
    }

    function initParticles(type) {
      state.particles = [];
      const count = type === 'snow' ? 60 : (type === 'petal' ? 32 : 24);
      for (let i = 0; i < count; i++) {
        state.particles.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          radius: Math.random() * 3.2 + 1.2,
          vx: (Math.random() - 0.5) * 1.1,
          vy: type === 'light' ? -(Math.random() * 0.6 + 0.2) : (Math.random() * 1.1 + 0.4),
          alpha: Math.random() * 0.65 + 0.25,
          angle: Math.random() * Math.PI * 2
        });
      }
    }

    function animateParticles() {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const currentPoem = appData.poems[state.currentIndex];

      state.particles.forEach(p => {
        ctx.save();
        ctx.beginPath();
        if (currentPoem.particleType === 'petal') {
          ctx.fillStyle = `rgba(245, 195, 190, ${p.alpha})`;
          ctx.translate(p.x, p.y);
          ctx.rotate(p.angle);
          ctx.ellipse(0, 0, p.radius * 2.1, p.radius, 0, 0, Math.PI * 2);
          ctx.fill();
        } else if (currentPoem.particleType === 'light') {
          ctx.fillStyle = `rgba(255, 245, 190, ${p.alpha})`;
          ctx.arc(p.x, p.y, p.radius * 1.2, 0, Math.PI * 2);
          ctx.fill();
        } else if (currentPoem.particleType === 'snow') {
          ctx.fillStyle = `rgba(255, 255, 255, ${p.alpha + 0.15})`;
          ctx.arc(p.x, p.y, p.radius, 0, Math.PI * 2);
          ctx.fill();
        } else {
          ctx.fillStyle = `rgba(235, 240, 245, ${p.alpha * 0.5})`;
          ctx.arc(p.x, p.y, p.radius * 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
        ctx.restore();

        p.x += p.vx;
        p.y += p.vy;
        p.angle += 0.02;

        if (p.y > canvas.height + 10) p.y = -10;
        if (p.y < -10) p.y = canvas.height + 10;
        if (p.x > canvas.width + 10) p.x = -10;
        if (p.x < -10) p.x = canvas.width + 10;
      });

      requestAnimationFrame(animateParticles);
    }

    /* ==========================================================================
       5. 真声朗读引擎 (Web Speech API)
       ========================================================================== */
    // 获取最佳中文语音包
    function getChineseVoice() {
      if (!('speechSynthesis' in window)) return null;
      const voices = window.speechSynthesis.getVoices();
      return voices.find(v => v.lang.includes('zh-CN') && (v.name.includes('Xiaoxiao') || v.name.includes('Ting') || v.name.includes('Google')))
        || voices.find(v => v.lang.includes('zh'))
        || null;
    }

    // 单独朗读某个词语
    function speakSingleWord(wordText) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      const utter = new SpeechSynthesisUtterance(wordText);
      utter.lang = 'zh-CN';
      utter.rate = 0.85;
      const zhVoice = getChineseVoice();
      if (zhVoice) utter.voice = zhVoice;
      window.speechSynthesis.speak(utter);
    }

    // 真声朗读整首古诗并同步高亮字词
    function startReading(rate = 0.8) {
      duckBgmVolume(); // 朗读开始：配乐自动调小声
      stopReading();
      state.isReading = true;

      const readBtn = document.getElementById('readBtn');
      readBtn.classList.add('reading-active');
      readBtn.innerHTML = "<span>⏹</span> 停止朗读";

      const poem = appData.poems[state.currentIndex];
      const tokens = Array.from(document.querySelectorAll('.word-token'));

      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
        const zhVoice = getChineseVoice();

        // 构建分段语音队列：先读标题作者，再逐词/逐句高亮朗读
        const headerUtter = new SpeechSynthesisUtterance(`${poem.title}，${poem.author.replace(/[〔〕]/g, '')}`);
        headerUtter.lang = 'zh-CN';
        headerUtter.rate = rate;
        if (zhVoice) headerUtter.voice = zhVoice;

        let tokenCursor = 0;

        headerUtter.onend = () => {
          if (!state.isReading) return;
          speakNextToken();
        };

        function speakNextToken() {
          if (!state.isReading || tokenCursor >= tokens.length) {
            stopReading();
            return;
          }
          tokens.forEach(t => t.classList.remove('highlight'));
          const currentEl = tokens[tokenCursor];
          currentEl.classList.add('highlight');

          const textToRead = currentEl.getAttribute('data-word');
          const noteToDisplay = currentEl.getAttribute('data-note');
          showAnnotation(textToRead, noteToDisplay, false);

          const u = new SpeechSynthesisUtterance(textToRead);
          u.lang = 'zh-CN';
          u.rate = rate;
          u.pitch = 0.96;
          if (zhVoice) u.voice = zhVoice;

          u.onend = () => {
            if (!state.isReading) return;
            tokenCursor++;
            // 每句结尾稍微停顿更有抑扬顿挫感
            const pause = tokenCursor % 2 === 0 ? 420 : 140;
            state.readTimer = setTimeout(speakNextToken, pause);
          };

          u.onerror = () => {
            stopReading();
          };

          window.speechSynthesis.speak(u);
        }

        window.speechSynthesis.speak(headerUtter);
      } else {
        // 降级节奏高亮
        let index = 0;
        state.readTimer = setInterval(() => {
          tokens.forEach(t => t.classList.remove('highlight'));
          if (index < tokens.length) {
            tokens[index].classList.add('highlight');
            index++;
          } else {
            stopReading();
          }
        }, 900);
      }
    }

    function speakSlowFollow() {
      startReading(0.62);
    }

    function stopReading() {
      restoreBgmVolume(); // 朗读停止/结束：配乐平滑恢复正常音量
      state.isReading = false;
      clearTimeout(state.readTimer);
      clearInterval(state.readTimer);
      if ('speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      }
      document.querySelectorAll('.word-token').forEach(t => t.classList.remove('highlight'));
      const readBtn = document.getElementById('readBtn');
      readBtn.classList.remove('reading-active');
      readBtn.innerHTML = "<span>🔊</span> 真声朗读";
    }

    /* ==========================================================================
       6. 画卷图源管理 (动态水墨 / 网页精选古风图 / 用户自定义上传或URL)
       ========================================================================== */
    function setVisualMode(mode) {
      state.visualMode = mode;
      const inkBtn = document.getElementById('modeInkBtn'); if (inkBtn) inkBtn.classList.toggle('active', mode === 'ink');
      const photoBtn = document.getElementById('modePhotoBtn'); if (photoBtn) photoBtn.classList.toggle('active', mode === 'curated');
      const customBtn = document.getElementById('modeCustomBtn'); if (customBtn) customBtn.classList.toggle('active', mode === 'custom');

      const drawer = document.getElementById('customImgDrawer');
      if (drawer) drawer.classList.toggle('show', mode === 'custom');

      updateStageVisuals();
    }

    // 诗词与用户提供的 9 张精选国风高清画卷精准匹配
    const POEM_BG_IMAGES = {
      jiangxue: "images/1793760022.png",      // 《江雪》 - 寒江独钓
      yueye: "images/1793759606.png",         // 《静夜思》 - 明月清辉
      chunshan: "images/1793759606.png",      // 《鸟鸣涧》 - 月出惊山鸟
      luchai: "images/1793760258.png",        // 《鹿柴》 - 空山返景
      baidicheng: "images/1793759780.png",    // 《早发白帝城》 - 轻舟万重山
      lushanpubu: "images/1793759696.png",    // 《望庐山瀑布》 - 飞流三千尺
      yinhushang: "images/1793760176.png",    // 《饮湖上初晴后雨》 - 西湖水光山色
      jueju: "images/1793760099.png",         // 《绝句》 - 翠柳黄鹂春意
      zhuliguan: "images/1793759874.png",     // 《竹里馆》 - 幽篁弹琴长啸
      fengqiaoyepo: "images/1793760910.png"   // 《枫桥夜泊》 - 姑苏夜半钟声到客船
    };

    function updateStageVisuals() {
      const poem = appData.poems[state.currentIndex];
      const customLayer = document.getElementById("customImageLayer");
      const layerBg = document.getElementById("layerBg");
      const layerMid = document.getElementById("layerMid");
      const layerFore = document.getElementById("layerFore");

      document.getElementById("watermarkText").innerText = poem.watermark;

      // 背景直接替换为用户提供的本地高清国风大图！
      const bgImg = POEM_BG_IMAGES[poem.id] || "images/1793760910.png";
      customLayer.style.backgroundImage = `url("${bgImg}")`;
      customLayer.style.opacity = "1";
      customLayer.style.backgroundSize = "cover";
      customLayer.style.backgroundPosition = "center";

      // 隐藏生硬的灰色矢量层，保留最上层灵动的粒子动态效果
      layerBg.style.opacity = "0";
      layerMid.style.opacity = "0";
      layerFore.style.opacity = "0.2";
    }
    function applyCustomUrlImage() {
      const input = document.getElementById('customImgUrlInput');
      const url = input.value.trim();
      if (!url) return;
      const poem = appData.poems[state.currentIndex];
      state.customImages[poem.id] = url;
      setVisualMode('custom');
    }

    function handleLocalImageUpload(event) {
      const file = event.target.files && event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = function(e) {
        const poem = appData.poems[state.currentIndex];
        state.customImages[poem.id] = e.target.result;
        setVisualMode('custom');
      };
      reader.readAsDataURL(file);
    }

    /* ==========================================================================
       7. 界面渲染与交互逻辑 (导航、诗文带拼音、赏析、闯关)
       ========================================================================== */
    function renderNav() {
      const navContainer = document.getElementById('navTabs');
      navContainer.innerHTML = appData.poems.map((poem, index) => `
        <button class="tab-btn ${index === state.currentIndex ? 'active' : ''}" 
                role="tab" 
                aria-selected="${index === state.currentIndex}"
                onclick="switchPoem(${index})">
          ${poem.scene} · 《${poem.title}》
        </button>
      `).join('');
    }

    function renderScene() {
      const poem = appData.poems[state.currentIndex];
      document.getElementById('layerBg').innerHTML = poem.svgBg;
      document.getElementById('layerMid').innerHTML = poem.svgMid;
      document.getElementById('layerFore').innerHTML = poem.svgFore;
      initParticles(poem.particleType);
      updateStageVisuals();
      spawnInkBlot(); // 切换古诗时背景自然晕开一滴新墨
    }

    // 将词语与对应拼音组装成 <ruby> 标签
    function buildRubyHtml(text, pinyinArr) {
      const chars = Array.from(text);
      return chars.map((ch, idx) => {
        const py = pinyinArr && pinyinArr[idx] ? pinyinArr[idx] : '';
        return `<ruby>${ch}<rt>${py}</rt></ruby>`;
      }).join('');
    }

    function renderPoem() {
      const poem = appData.poems[state.currentIndex];
      document.getElementById('poemTitle').innerText = poem.title;
      document.getElementById('poemMeta').innerText = poem.author;
      document.getElementById('translationBox').innerHTML = `<strong>【白话译文】</strong>${poem.translation}`;
      document.getElementById('appreciationText').innerText = poem.appreciation;
      document.getElementById('poetBioBox').innerText = poem.poetBio;

      // 渲染核心意象标签
      const tagsContainer = document.getElementById('imageryTags');
      tagsContainer.innerHTML = poem.imagery.map(tag => `
        <span class="imagery-tag">✦ 意象：${tag}</span>
      `).join('');

      const bodyContainer = document.getElementById('poemBody');
      bodyContainer.className = `poem-body ${state.showPinyin ? '' : 'hide-pinyin'} ${state.isVertical ? 'vertical-mode' : ''}`;

      bodyContainer.innerHTML = poem.lines.map((line, lineIdx) => {
        const punc = lineIdx % 2 === 0 ? '，' : '。';
        const tokensHtml = line.map(token => `
          <span class="word-token" 
                tabindex="0" 
                role="button"
                data-word="${token.text}"
                data-note="${token.note}"
                aria-label="${token.text}，点击查看释义并朗读"
                onclick="showAnnotation('${token.text}', '${token.note}', true)"
                onkeydown="if(event.key==='Enter'||event.key===' ') showAnnotation('${token.text}', '${token.note}', true)">
            ${buildRubyHtml(token.text, token.pinyin)}
          </span>
        `).join('');
        return `<div class="poem-line">${tokensHtml}<span class="punctuation">${punc}</span></div>`;
      }).join('');

      document.getElementById('annotationBox').innerHTML = `
        <p style="color: var(--text-muted);">👆 点击左侧诗句中的任意词组，即可查看详细释义并听取读音。</p>
      `;
    }

    function showAnnotation(text, note, autoSpeak = false) {
      document.getElementById('annotationBox').innerHTML = `
        <div style="display:flex; align-items:center; justify-content:space-between;">
          <strong style="font-size: 1.3rem; color: var(--ink-accent);">【${text}】</strong>
          <button class="speak-word-btn" onclick="speakSingleWord('${text}')">🔊 读音</button>
        </div>
        <p style="margin-top: 8px; font-size: 1.05rem;">${note}</p>
      `;
      if (autoSpeak && !state.isReading) {
        speakSingleWord(text);
      }
    }

    function switchInfoTab(tab) {
      const isNote = tab === 'note';
      document.getElementById('tabNoteBtn').classList.toggle('active', isNote);
      document.getElementById('tabAppreciationBtn').classList.toggle('active', !isNote);
      document.getElementById('infoPanelNote').style.display = isNote ? 'block' : 'none';
      document.getElementById('infoPanelAppreciation').style.display = isNote ? 'none' : 'block';
    }

    function togglePinyin() {
      state.showPinyin = !state.showPinyin;
      document.getElementById('togglePinyinBtn').classList.toggle('active', state.showPinyin);
      document.getElementById('poemBody').classList.toggle('hide-pinyin', !state.showPinyin);
    }

    function toggleVerticalMode() {
      state.isVertical = !state.isVertical;
      document.getElementById('toggleVerticalBtn').classList.toggle('active', state.isVertical);
      document.getElementById('poemBody').classList.toggle('vertical-mode', state.isVertical);
    }

    function toggleDarkMode() {
      const root = document.documentElement;
      const isDark = root.getAttribute('data-theme') === 'dark';
      if (isDark) {
        root.removeAttribute('data-theme');
        document.getElementById('toggleThemeBtn').innerHTML = `<span>🌙</span> 夜读模式`;
      } else {
        root.setAttribute('data-theme', 'dark');
        document.getElementById('toggleThemeBtn').innerHTML = `<span>☀️</span> 宣纸模式`;
      }
    }

    /* ==========================================================================
       8. 诗词闯关测试系统 (字词默写 + 上下句接龙)
       ========================================================================== */
    function setQuizMode(mode) {
      state.quizMode = mode;
      document.getElementById('quizModeWordBtn').classList.toggle('active', mode === 'word');
      document.getElementById('quizModeLineBtn').classList.toggle('active', mode === 'line');
      renderQuiz();
    }

    function renderQuiz() {
      const poem = appData.poems[state.currentIndex];
      document.getElementById('quizFeedback').innerText = "";

      if (state.quizMode === 'word') {
        const allTokens = poem.lines.flat();
        const randomToken = allTokens[Math.floor(Math.random() * allTokens.length)];
        state.quizAnswer = randomToken.text;

        const otherTokens = appData.poems.flatMap(p => p.lines.flat())
          .map(t => t.text)
          .filter(t => t !== randomToken.text && t.length === randomToken.text.length);

        const shuffledOthers = otherTokens.sort(() => Math.random() - 0.5);
        const options = [randomToken.text, shuffledOthers[0] || "明月", shuffledOthers[1] || "清风"]
          .sort(() => Math.random() - 0.5);

        const fullText = poem.lines.map((l, idx) => l.map(t => t.text).join('') + (idx % 2 === 0 ? '，' : '。')).join('');
        const questionText = fullText.replace(randomToken.text, "（ ？ ）");

        document.getElementById('quizQuestion').innerText = questionText;
        renderQuizOptions(options);
      } else {
        // 上下句接龙模式
        const fullLines = poem.lines.map(l => l.map(t => t.text).join(''));
        const pairIdx = Math.random() > 0.5 ? 0 : 2;
        const promptLine = fullLines[pairIdx];
        const answerLine = fullLines[pairIdx + 1];
        state.quizAnswer = answerLine;

        const otherLines = appData.poems.flatMap(p => p.lines.map(l => l.map(t => t.text).join('')))
          .filter(l => l !== answerLine);
        const shuffledLines = otherLines.sort(() => Math.random() - 0.5);
        const options = [answerLine, shuffledLines[0], shuffledLines[1]].sort(() => Math.random() - 0.5);

        document.getElementById('quizQuestion').innerText = `“${promptLine}” 的下一句是？`;
        renderQuizOptions(options);
      }
    }

    function renderQuizOptions(options) {
      const optionsContainer = document.getElementById('quizOptions');
      optionsContainer.innerHTML = options.map(opt => `
        <button class="option-btn" onclick="checkAnswer('${opt}')">${opt}</button>
      `).join('');
    }

    function checkAnswer(selected) {
      const feedback = document.getElementById('quizFeedback');
      if (selected === state.quizAnswer) {
        state.quizStreak++;
        state.quizScore += 10;
        feedback.style.color = "var(--jade-green)";
        feedback.innerText = "✓ 回答正确！胸藏文墨怀若谷，意境相融。";
        spawnInkBlot();
      } else {
        state.quizStreak = 0;
        feedback.style.color = "var(--ink-accent)";
        feedback.innerText = `× 差一点点，正确答案是：“${state.quizAnswer}”`;
      }
      document.getElementById('quizScoreBadge').innerText = `连对: ${state.quizStreak} 题 | 总分: ${state.quizScore}`;
    }

    /* ==========================================================================
       9. 事件监听与初始化
       ========================================================================== */
    function switchPoem(index) {
      if (state.isReading) stopReading();
      state.currentIndex = index;
      renderNav();
      renderScene();
      renderPoem();
      renderQuiz();
    }

    document.getElementById('readBtn').addEventListener('click', () => {
      if (state.isReading) {
        stopReading();
      } else {
        startReading(0.8);
      }
    });

    // 回车应用自定义图片 URL
    const customImgInput = document.getElementById('customImgUrlInput');
    if (customImgInput) customImgInput.addEventListener('keydown', (e) => { if (e.key === 'Enter') applyCustomUrlImage();
    });

    // 画卷多层鼠标视差交互
    document.getElementById('scrollStage').addEventListener('mousemove', (e) => {
      if (window.matchMedia('(prefers-reduced-motion: reduce)').matches) return;
      const rect = e.currentTarget.getBoundingClientRect();
      const offsetX = (e.clientX - rect.left) / rect.width - 0.5;
      const offsetY = (e.clientY - rect.top) / rect.height - 0.5;

      document.getElementById('layerBg').style.transform = `translate(${offsetX * 14}px, ${offsetY * 8}px)`;
      document.getElementById('layerMid').style.transform = `translate(${offsetX * 26}px, ${offsetY * 14}px)`;
      document.getElementById('layerFore').style.transform = `translate(${offsetX * 42}px, ${offsetY * 20}px)`;
      document.getElementById('customImageLayer').style.transform = `translate(${offsetX * 12}px, ${offsetY * 8}px)`;
    });

    // 鼠标在页面移动时，背景宣纸也会随光标自动泛起淡淡的水墨晕染
    window.addEventListener('mousemove', (e) => {
      const now = Date.now();
      if (now - state.lastMouseInkTime > 1600) {
        state.lastMouseInkTime = now;
        spawnInkBlot(e.clientX, e.clientY, 85);
      }
    });

    window.addEventListener('resize', resizeCanvas);

    window.addEventListener('DOMContentLoaded', () => {
      initInkBg();
      resizeCanvas();
      renderNav();
      renderScene();
      renderPoem();
      renderQuiz();
      animateParticles();
      animateInkBackground();

      // 预加载语音包列表
      if ('speechSynthesis' in window) {
        window.speechSynthesis.onvoiceschanged = () => {
          getChineseVoice();
        };
      }
    });
  
// ==================== 古风背景音乐自动播放与朗读智能闪避系统 ====================
const bgmTracks = [
  { name: '云水相望', src: 'audio/bgm_track1.mp3' },
  { name: '松间风起', src: 'audio/bgm_track2.mp3' }
];
let currentBgmIndex = 0;
let bgmAudio = new Audio();
bgmAudio.src = bgmTracks[0].src;
bgmAudio.loop = false;
const NORMAL_BGM_VOL = 0.55;
const DUCK_BGM_VOL = 0.12; // 朗读时配乐自动调小声
bgmAudio.volume = NORMAL_BGM_VOL;

let bgmFadeTimer = null;
function setBgmVolumeSmooth(targetVol, duration = 380) {
  if (!bgmAudio) return;
  clearInterval(bgmFadeTimer);
  const startVol = bgmAudio.volume;
  const startTime = performance.now();
  bgmFadeTimer = setInterval(() => {
    const elapsed = performance.now() - startTime;
    const p = Math.min(1, elapsed / duration);
    bgmAudio.volume = Math.max(0, Math.min(1, startVol + (targetVol - startVol) * p));
    if (p >= 1) {
      clearInterval(bgmFadeTimer);
      bgmAudio.volume = targetVol;
    }
  }, 25);
}

function duckBgmVolume() {
  setBgmVolumeSmooth(DUCK_BGM_VOL, 350);
}

function restoreBgmVolume() {
  setBgmVolumeSmooth(NORMAL_BGM_VOL, 450);
}

function updateBgmUI(isPlaying) {
  const icon = document.getElementById('bgmIcon');
  const title = document.getElementById('bgmTitle');
  const btn = document.getElementById('bgmToggleBtn');
  if (title) title.textContent = bgmTracks[currentBgmIndex].name;
  if (btn) btn.textContent = isPlaying ? '❚❚ 暂停' : '▶ 播放';
  if (icon) icon.style.opacity = isPlaying ? '1' : '0.5';
}

function playBgmTrack(index) {
  currentBgmIndex = index % bgmTracks.length;
  bgmAudio.src = bgmTracks[currentBgmIndex].src;
  bgmAudio.play().then(() => {
    updateBgmUI(true);
  }).catch(err => {
    console.log('Autoplay deferred:', err);
    updateBgmUI(false);
  });
}

bgmAudio.onended = () => {
  playBgmTrack((currentBgmIndex + 1) % bgmTracks.length); // 自动连续循环播放
};

function tryAutoPlayBgm() {
  bgmAudio.play().then(() => {
    updateBgmUI(true);
  }).catch(() => {
    updateBgmUI(false);
    const resumeOnInteraction = () => {
      bgmAudio.play().then(() => updateBgmUI(true)).catch(e => console.log(e));
      window.removeEventListener('click', resumeOnInteraction);
      window.removeEventListener('keydown', resumeOnInteraction);
      window.removeEventListener('touchstart', resumeOnInteraction);
    };
    window.addEventListener('click', resumeOnInteraction, { once: true });
    window.addEventListener('keydown', resumeOnInteraction, { once: true });
    window.addEventListener('touchstart', resumeOnInteraction, { once: true });
  });
}

window.addEventListener('DOMContentLoaded', tryAutoPlayBgm);

function toggleBgm() {
  if (bgmAudio.paused) {
    bgmAudio.play();
    updateBgmUI(true);
  } else {
    bgmAudio.pause();
    updateBgmUI(false);
  }
}

function nextBgmTrack() {
  playBgmTrack((currentBgmIndex + 1) % bgmTracks.length);
}

function backToHome() {
  if (window.parent && window.parent.closeModal) {
    window.parent.closeModal();
  } else {
    location.href = '../../index.html';
  }
}
</script>
