<!DOCTYPE html>
<html lang="zh">

<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>钢铁海战</title>
  <style>
    :root {
      box-sizing: border-box;
      padding-top: env(safe-area-inset-top, 0px);
      padding-bottom: env(safe-area-inset-bottom, 0px)
    }

    html,
    body {
      margin: 0;
      height: 100%;
      background: #05070b;
      overflow: hidden;
      font-family: "Noto Serif SC", "Songti SC", serif
    }

    canvas {
      display: block;
      position: fixed;
      inset: 0;
      touch-action: none;
      cursor: grab
    }

    .t {
      position: fixed;
      left: 20px;
      top: calc(env(safe-area-inset-top, 0px) + 16px);
      color: #cfd8e6;
      text-shadow: 0 1px 8px #000;
      pointer-events: none;
      letter-spacing: .2em
    }

    .t b {
      font-size: 22px;
      font-weight: 600
    }

    .t small {
      display: block;
      margin-top: 4px;
      font-size: 12px;
      opacity: .65;
      letter-spacing: .15em
    }

    #p {
      position: fixed;
      right: 12px;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      width: 176px;
      padding: 10px 12px;
      background: #0b1018b8;
      backdrop-filter: blur(8px);
      border: 1px solid #ffffff22;
      border-radius: 10px;
      color: #d6deea;
      font: 12px/1.2 system-ui, sans-serif;
      max-height: 85vh;
      overflow: auto
    }

    #p label {
      display: flex;
      flex-direction: column;
      gap: 3px;
      margin-bottom: 8px
    }

    #p label:has(input[type=checkbox]) {
      flex-direction: row;
      align-items: center;
      gap: 6px;
      margin-bottom: 5px
    }

    #p input[type=range] {
      width: 100%
    }

    #p select,
    #p button {
      background: #1a2230;
      color: #d6deea;
      border: 1px solid #ffffff2a;
      border-radius: 6px;
      padding: 4px
    }

    #p button {
      width: 100%;
      margin-top: 6px;
      cursor: pointer
    }

    #p {
      top: calc(env(safe-area-inset-top, 0px) + 54px) !important
    }

    #gear {
      position: fixed;
      right: 12px;
      top: calc(env(safe-area-inset-top, 0px) + 12px);
      width: 34px;
      height: 34px;
      border-radius: 17px;
      border: 1px solid #fff3;
      background: #0b1018b8;
      color: #fff;
      font-size: 17px;
      cursor: pointer
    }

    #g {
      position: fixed;
      inset: 0;
      pointer-events: none;
      color: #fff;
      font: 600 14px system-ui, sans-serif;
      text-shadow: 0 1px 6px #000
    }

    #g.m #gt,
    #g.m #gb,
    #g.m #gc {
      display: none
    }

    #gt {
      position: absolute;
      top: calc(env(safe-area-inset-top, 0px) + 64px);
      left: 50%;
      transform: translateX(-50%);
      padding: 5px 14px;
      background: #0b1018a0;
      border-radius: 14px;
      white-space: nowrap
    }

    #gb {
      position: absolute;
      left: 16px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 18px);
      width: 230px;
      height: 12px;
      background: #0008;
      border: 1px solid #fff4;
      border-radius: 6px;
      overflow: hidden
    }

    #hp {
      display: block;
      height: 100%;
      background: linear-gradient(90deg, #e33, #6d4)
    }

    #gc {
      position: absolute;
      left: 16px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 38px);
      font-size: 12px;
      opacity: .9
    }

    #bn {
      position: absolute;
      top: 30%;
      width: 100%;
      text-align: center;
      font-size: 30px;
      letter-spacing: .2em;
      opacity: 0;
      transition: opacity .6s
    }

    #ov {
      position: absolute;
      inset: 0;
      display: none;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      gap: 10px;
      background: #050a12b0;
      pointer-events: auto;
      text-align: center;
      padding: 20px
    }

    #ov h1 {
      margin: 0;
      font-size: 38px;
      letter-spacing: .25em
    }

    #ov h2 {
      margin: 0
    }

    #ov p {
      margin: 0;
      opacity: .85;
      font-weight: 400;
      line-height: 1.7
    }

    #ov button {
      min-width: 240px;
      padding: 10px 18px;
      border-radius: 8px;
      border: 1px solid #ffffff44;
      background: #1b2a42;
      color: #fff;
      font: 600 15px system-ui;
      cursor: pointer
    }

    #ov button:hover {
      background: #2c4468
    }

    #tc {
      position: fixed;
      right: 10px;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 14px);
      display: flex;
      gap: 8px;
      touch-action: none
    }

    #tc b {
      width: 46px;
      height: 46px;
      border-radius: 23px;
      background: #0b1018b0;
      border: 1px solid #fff4;
      color: #fff;
      display: flex;
      align-items: center;
      justify-content: center;
      font: 600 16px system-ui;
      user-select: none
    }

    #tc {
      flex-wrap: wrap;
      justify-content: flex-end;
      max-width: 270px
    }

    #sk {
      position: absolute;
      left: 50%;
      bottom: calc(env(safe-area-inset-bottom, 0px) + 16px);
      transform: translateX(-50%);
      display: flex;
      gap: 10px
    }

    #g.m #sk {
      display: none
    }

    .k {
      position: relative;
      width: 56px;
      height: 56px;
      border-radius: 12px;
      background: #0b1018c0;
      border: 1px solid #ffffff44;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font: 600 11px system-ui;
      overflow: hidden
    }

    .k b {
      font-size: 19px
    }

    .k i {
      position: absolute;
      left: 0;
      right: 0;
      bottom: 0;
      height: 0;
      background: #000b
    }

    .k.on {
      border-color: #5ff;
      box-shadow: 0 0 12px #5ff8
    }

    @media(pointer:coarse) {
      #sk {
        display: none
      }
    }
  </style>
</head>

<body>
  <div class="t"><b>钢铁海战</b><small id="hud"></small></div>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script>
    const COMMON = `uniform float uTime,uTravel,uFlash,uStorm,uWave,uFog;uniform vec3 uSun;`;
    const SKY = `
float hs(vec2 p){return fract(sin(dot(p,vec2(127.1,311.7)))*43758.5453);}
float nz(vec2 p){vec2 i=floor(p),f=fract(p);f=f*f*(3.-2.*f);return mix(mix(hs(i),hs(i+vec2(1,0)),f.x),mix(hs(i+vec2(0,1)),hs(i+vec2(1,1)),f.x),f.y);}
float fbm(vec2 p){float a=.5,s=0.;for(int i=0;i<4;i++){s+=a*nz(p);p*=2.03;a*=.5;}return s;}
vec3 sky(vec3 d){
  float t=clamp(d.y,0.,1.);
  float day=smoothstep(-.05,.3,uSun.y),cm=day*(1.-uStorm*.75);
  vec3 hor=mix(vec3(.13,.15,.18),mix(vec3(.95,.5,.3),vec3(.7,.84,.97),smoothstep(.1,.5,uSun.y)),cm);
  vec3 zen=mix(vec3(.012,.016,.026),vec3(.08,.3,.72),cm);
  vec3 c=mix(hor,zen,pow(t,.4));
  vec2 q=d.xz/(d.y+.3)*1.6+vec2(uTime*.03,uTime*.012);
  float cl=smoothstep(.7-uStorm*.4,.9,fbm(q*1.4));
  float s=max(dot(d,uSun),0.);
  c+=vec3(1.,.8,.55)*(pow(s,800.)*5.+pow(s,14.)*.22)*(1.-uStorm*.85)*step(-.02,uSun.y);
  c=mix(c,mix(vec3(.035,.04,.05),vec3(.85,.86,.88)*(.2+.8*day),1.-uStorm),cl*(.35+.55*uStorm));
  c+=vec3(.45,.52,.75)*uFlash*(.25+cl*.9)*(.4+t);
  return c;
}`;
    const WAVES = `
void wv(vec2 p,vec2 d,float k,float a,inout float h,inout vec2 g){
  d=normalize(d);float ph=dot(d,p)*k+sqrt(9.8*k)*uTime;h+=uWave*a*sin(ph);g+=uWave*a*k*cos(ph)*d;}
float waves(vec2 p,int n,out vec2 g){
  float h=0.;g=vec2(0.);
  wv(p,vec2(1.,.3),.3,1.6,h,g);wv(p,vec2(.6,1.),.55,.8,h,g);wv(p,vec2(-.4,1.),1.,.35,h,g);
  if(n>3){wv(p,vec2(1.,-.7),1.9,.16,h,g);wv(p,vec2(.2,1.),3.5,.07,h,g);}
  return h;}`;
    const WV = [[1, .3, .3, 1.6], [.6, 1, .55, .8], [-.4, 1, 1, .35]];
    function H(x, z, t) { let h = 0; for (const [dx, dz, k, a] of WV) h += WS * a * Math.sin((dx * x + dz * z) / Math.hypot(dx, dz) * k + Math.sqrt(9.8 * k) * t); return h }
    const TM = `#include <tonemapping_fragment>
#include <encodings_fragment>`;

    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2)); renderer.setSize(innerWidth, innerHeight);
    renderer.outputEncoding = THREE.sRGBEncoding; renderer.toneMapping = THREE.ACESFilmicToneMapping; renderer.toneMappingExposure = 1.1;
    renderer.shadowMap.enabled = true; renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    const camera = new THREE.PerspectiveCamera(50, innerWidth / innerHeight, .5, 3000);
    const U = { uTime: { value: 0 }, uTravel: { value: 0 }, uFlash: { value: 0 }, uStorm: { value: .6 }, uWave: { value: 1 }, uFog: { value: .6 }, uSun: { value: new THREE.Vector3(-.5, .06, -.86).normalize() } };

    const dome = new THREE.Mesh(new THREE.SphereGeometry(900, 32, 16), new THREE.ShaderMaterial({
      uniforms: U, side: THREE.BackSide, depthWrite: false,
      vertexShader: `varying vec3 vD;void main(){vD=position;gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.);}`,
      fragmentShader: `${COMMON}varying vec3 vD;${SKY}void main(){gl_FragColor=vec4(sky(normalize(vD)),1.);${TM}}`
    }));
    dome.frustumCulled = false; dome.renderOrder = -1; scene.add(dome);

    const wg = new THREE.PlaneGeometry(1000, 1000, 360, 360); wg.rotateX(-Math.PI / 2);
    const water = new THREE.Mesh(wg, new THREE.ShaderMaterial({
      uniforms: U, side: THREE.DoubleSide,
      vertexShader: `${COMMON}${WAVES}varying vec2 vP;varying vec3 vW;
  void main(){vec2 g;float h=waves(vec2(position.x,position.z-uTravel),3,g);vec3 p=vec3(position.x,h,position.z);vP=position.xz;vW=p;gl_Position=projectionMatrix*viewMatrix*vec4(p,1.);}`,
      fragmentShader: `${COMMON}${WAVES}${SKY}varying vec2 vP;varying vec3 vW;
  void main(){
    vec2 g;float h=waves(vec2(vP.x,vP.y-uTravel),5,g);
    vec3 V=normalize(cameraPosition-vW);float d=length(cameraPosition-vW);
    vec3 N=normalize(vec3(-g.x,1.,-g.y));N=normalize(mix(N,vec3(0,1,0),clamp(d/450.,0.,.7)));
    vec3 R=reflect(-V,N);R.y=abs(R.y);
    float F=clamp(.025+.975*pow(1.-max(dot(N,V),0.),5.),0.,1.);
    vec3 body=mix(vec3(.003,.009,.013),vec3(.018,.045,.055),clamp(h*.22+.4,0.,1.))*(1.+uFlash*5.+7.*smoothstep(0.,.4,uSun.y)*(1.-uStorm*.5));
    float dy=smoothstep(0.,.4,uSun.y)*(1.-uStorm*.7);
    body=mix(body,mix(vec3(.02,.12,.2),vec3(.06,.5,.6),clamp(h*.25+.5,0.,1.)),dy);
    vec3 col=mix(body,sky(R),F);
    col+=vec3(1.,.85,.6)*pow(max(dot(R,uSun),0.),120.)*1.4*(1.-uStorm*.8)*step(-.02,uSun.y);
    float n=.5+.5*sin(vP.x*2.3+uTime)*sin(vP.y*1.7-uTime*.8)*sin((vP.x+vP.y)*.9);
    float sl=length(g),f2=fbm(vP*.45+vec2(uTime*.1,0.));
    float foam=smoothstep(.95,1.9,h/max(uWave,.4)+n*.5+sl*1.4)*(.5+.9*f2)+smoothstep(.5,.9,sl)*.5*f2;
    col=mix(col,vec3(.92,.96,1.)*(.45+uFlash*3.+1.1*smoothstep(0.,.4,uSun.y)),clamp(foam,0.,1.));
    col=mix(col,sky(normalize(vec3(-V.x,.02,-V.z))),max(1.-exp(-pow(d*.0055*uFog,2.)),smoothstep(320.,480.,d)));
    gl_FragColor=vec4(col,1.);${TM}
  }`}));
    water.frustumCulled = false; scene.add(water);

    // 暴雨
    const N = 8000, sp = new Float32Array(N * 6), se = new Float32Array(N * 2);
    for (let i = 0; i < N; i++) { const p = [Math.random() * 140 - 70, Math.random() * 90, Math.random() * 140 - 70]; for (let k = 0; k < 2; k++) { sp.set(p, i * 6 + k * 3); se[i * 2 + k] = k } }
    const rg = new THREE.BufferGeometry(); rg.setAttribute('position', new THREE.BufferAttribute(sp, 3)); rg.setAttribute('aE', new THREE.BufferAttribute(se, 1));
    const rain = new THREE.LineSegments(rg, new THREE.ShaderMaterial({
      uniforms: U, transparent: true, depthWrite: false,
      vertexShader: `uniform float uTime;attribute float aE;varying float vA;
  void main(){vec3 s=position;float y=mod(s.y-uTime*55.,90.);vec2 c=cameraPosition.xz*.5;vec2 xz=mod(s.xz-c+70.,140.)-70.+c;
  vec3 p=vec3(xz.x+y*.2,y,xz.y)+aE*vec3(.3,1.6,0.);vA=(1.-aE*.7)*exp(-length(p-cameraPosition)*.011)*.5;gl_Position=projectionMatrix*viewMatrix*vec4(p,1.);}`,
      fragmentShader: `uniform float uFlash;varying float vA;void main(){gl_FragColor=vec4(vec3(.6,.68,.82)*(1.+uFlash*5.),vA);}`
    }));
    rain.frustumCulled = false; scene.add(rain);

    // 光：冷月 + 闪电 + 舰上灯
    const hemi = new THREE.HemisphereLight(0x39475c, 0x04060a, .8); scene.add(hemi);
    const moon = new THREE.DirectionalLight(0x7f98c8, 1.3); moon.position.set(-50, 75, -55);
    const shadowSet = l => { l.castShadow = true; Object.assign(l.shadow.camera, { left: -130, right: 130, top: 130, bottom: -130, near: 10, far: 500 }); l.shadow.bias = -.0004 };
    moon.shadow.mapSize.set(4096, 4096); shadowSet(moon); scene.add(moon);
    const boltL = new THREE.DirectionalLight(0xb4c8ff, 0); boltL.shadow.mapSize.set(1024, 1024); shadowSet(boltL); scene.add(boltL);

    // 战舰（驱逐舰造型：放样船体 + 倾斜上层建筑）
    function buildShip(T) {
      const ship = new THREE.Group();
      const isEnemy = T.team === 1;
      const M = (c, r, m) => new THREE.MeshStandardMaterial({ color: c, roughness: r, metalness: m, side: THREE.DoubleSide });
      const hazy = M(T.hull, .45, .15);
      const deckM = M(isEnemy ? 0x22181c : 0x3d4b58, .7, .1);
      const dark = M(isEnemy ? 0x1a1215 : 0x263342, .55, .15);
      const light = M(isEnemy ? 0x6e282d : 0x7a96b3, .5, .1);
      const glow = M(isEnemy ? 0xff2838 : 0x38bdf8, .4, 0);
      glow.emissive = new THREE.Color(isEnemy ? 0xff1020 : 0x00d4ff);
      glow.emissiveIntensity = 2.0;
      function add(g, m, x, y, z, p = ship) { const o = new THREE.Mesh(g, m); o.position.set(x, y, z); o.castShadow = o.receiveShadow = true; p.add(o); return o }
      const box = (w, h, d, x, y, z, m = hazy) => add(new THREE.BoxGeometry(w, h, d), m, x, y, z);
      const cyl = (a, b, h, x, y, z, m = hazy) => add(new THREE.CylinderGeometry(a, b, h, 20), m, x, y, z);
      function loft(st, prof, cap) {
        const P = [], I = [], n = prof(st[0]).length;
        st.forEach(r => prof(r).forEach(p => P.push(p[0], p[1], r[0])));
        for (let i = 0; i < st.length - 1; i++)for (let j = 0; j < n - 1; j++) { const a = i * n + j, c = a + n; I.push(a, c, a + 1, a + 1, c, c + 1) }
        if (cap) { const o = (st.length - 1) * n; for (let j = 1; j < n - 1; j++)I.push(o, o + j, o + j + 1) }
        const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(P, 3)); g.setIndex(I); g.computeVertexNormals(); return g
      }
      // [z, 水线半宽, 甲板半宽, 甲板高, 龙骨深]
      const ST = [[-26, .05, .1, 4.7, .3], [-22, 1, 1.9, 4.4, 1.3], [-16, 2.2, 3, 4, 2.1], [-8, 3, 3.5, 3.6, 2.6], [2, 3.2, 3.4, 3.4, 2.7], [14, 3.1, 3.3, 3.4, 2.7], [22, 2.7, 3, 3.4, 2.1], [25, 2.6, 2.9, 3.4, 1.5]];
      add(loft(ST, r => { const [, w, d, h, k] = r; return [[-d, h], [-w, 0], [-w * .62, -k * .8], [0, -k], [w * .62, -k * .8], [w, 0], [d, h]] }, true), hazy, 0, 0, 0);
      add(loft(ST, r => [[-r[2], r[3] + .03], [r[2], r[3] + .03]]), deckM, 0, 0, 0);
      function slab(pts, w, x, m, yo = 0) {
        const g = new THREE.ExtrudeGeometry(new THREE.Shape(pts.map(q => new THREE.Vector2(q[0], q[1]))), { depth: w, bevelEnabled: false });
        g.rotateY(-Math.PI / 2); g.translate(x + w / 2, yo, 0); const o = new THREE.Mesh(g, m); o.castShadow = o.receiveShadow = true; ship.add(o); return o
      }
      slab([[-7, 3.4], [10, 3.4], [10, 6.6], [-4.6, 6.6]], 5.4, 0, hazy);
      slab([[-5.2, 6.5], [3.2, 6.5], [3.2, 9.2], [-3.6, 9.2]], 4.2, 0, hazy);
      slab([[-3.4, 9.1], [1.2, 9.1], [1.2, 10.3], [-2.6, 10.3]], 3, 0, light);
      box(3.6, .4, .1, 0, 7.9, -4.45, glow).rotation.x = .53;
      for (const s of [-1, 1]) { box(.06, .35, 11, s * 2.73, 5.3, 3.5, glow); box(.15, 2, 2, s * 2.2, 8, -1.5, light).rotation.z = s * .12 }
      for (const z of [4.5, 8.8]) { const f = box(2.2, 2.8, 2.4, 0, 8, z, hazy); f.rotation.x = .2; box(2.25, .3, 2.45, 0, 8.9, z + .18, T.flag).rotation.x = .2; box(2, .1, 2.2, 0, 9.4, z + .28, dark).rotation.x = .2 }
      cyl(.14, .22, 6.5, 0, 13.55, -.8, dark); box(.04, 1.1, 1.8, 0, 13.2, .2, T.flag); box(3, .1, .1, 0, 12, -.8, dark);
      const radar = box(3.2, .18, .5, 0, 14.9, -.8, light);
      const mastL = add(new THREE.SphereGeometry(.14, 12, 8), glow, 0, 16.9, -.8);
      const red = M(0xff2020, .3, 0); red.emissive = new THREE.Color(0xff1010); red.emissiveIntensity = 2;
      const grn = M(0x20ff50, .3, 0); grn.emissive = new THREE.Color(0x10ff40); grn.emissiveIntensity = 2;
      add(new THREE.SphereGeometry(.13, 10, 8), red, -2.35, 8.6, -2.8); add(new THREE.SphereGeometry(.13, 10, 8), grn, 2.35, 8.6, -2.8);
      cyl(1.3, 1.4, .4, 0, 4.3, -17.5, dark);
      slab([[-18.8, 0], [-16.3, 0], [-16.3, 1], [-17.8, 1.35], [-18.8, .8]], 1.9, 0, hazy, 4.5);
      cyl(.09, .11, 4.2, 0, 5.3, -20.9, dark).rotation.x = Math.PI / 2 + .08;
      box(3, .3, 5, 0, 4, -11, dark);
      box(5.4, 3, 5.5, 0, 4.9, 14, hazy);
      cyl(.5, .55, .8, 0, 6.8, 13, dark); add(new THREE.SphereGeometry(.46, 16, 12), M(0xdfe3e6, .5, .1), 0, 7.4, 13);
      const hp = add(new THREE.RingGeometry(2, 2.3, 32), M(0xd8cfa0, .8, 0), 0, 3.47, 21); hp.rotation.x = -Math.PI / 2; hp.castShadow = false;
      box(.3, .02, 2.4, 0, 3.47, 21, M(0xd8cfa0, .8, 0));
      if (T.lamp) { const lamp = new THREE.PointLight(isEnemy ? 0xff2828 : 0x38bdf8, 1.4, 28); lamp.position.set(0, 9, -6); ship.add(lamp) }
      return { ship, radar }
    }

    // 闪电
    let boltLine = null, nextB = 2.5, fT = -9;
    function newBolt() {
      if (boltLine) scene.remove(boltLine);
      const pts = []; let x = -160 + Math.random() * 320, z = -230;
      for (let i = 0; i <= 16; i++) { pts.push(new THREE.Vector3(x, 170 - i * 10.6, z)); x += (Math.random() - .5) * 20; z += (Math.random() - .5) * 8 }
      boltLine = new THREE.Line(new THREE.BufferGeometry().setFromPoints(pts), new THREE.LineBasicMaterial({ color: 0xdde6ff, fog: false, toneMapped: false }));
      scene.add(boltLine); boltL.position.set(pts[0].x * .4, 130, -120);
    }

    const V = { hour: 10.5, storm: 0, wave: 1, fog: .25, exp: 1.1, spd: 1, sh: true, bolt: true, orb: true };
    let missiles = [], WS = 1, hB = .8, LM = 1, pi = 0, fI = 0, over = 0, score = [0, 0], fleet = [], shells = [];
