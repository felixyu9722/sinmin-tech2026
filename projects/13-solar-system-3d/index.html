<!DOCTYPE html>
<html lang="zh-CN">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>八大行星 - 3D太阳系视觉交互网页 (HD Ultra)</title>
  <!-- Tailwind CSS CDN -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- FontAwesome Icons -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <!-- Three.js Library -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <!-- OrbitControls for Three.js -->
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>

  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap');

    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background-color: #02040a;
      color: #f3f4f6;
      overflow-x: hidden;
    }

    /* Advanced Glassmorphism */
    .glass-panel {
      background: rgba(10, 16, 31, 0.75);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      box-shadow: 0 8px 32px 0 rgba(0, 0, 0, 0.5);
    }

    .glass-btn {
      background: rgba(255, 255, 255, 0.06);
      backdrop-filter: blur(10px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      transition: all 0.25s cubic-bezier(0.4, 0, 0.2, 1);
    }

    .glass-btn:hover {
      background: rgba(255, 255, 255, 0.18);
      border-color: rgba(255, 255, 255, 0.35);
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.4);
    }

    .glass-btn.active {
      background: rgba(59, 130, 246, 0.3);
      border-color: #3b82f6;
      box-shadow: 0 0 20px rgba(59, 130, 246, 0.6);
    }

    .planet-nav-btn {
      position: relative;
      transition: all 0.25s ease;
    }
    .planet-nav-btn.active {
      background: linear-gradient(135deg, rgba(6, 182, 212, 0.45), rgba(59, 130, 246, 0.35)) !important;
      border: 1px solid #38bdf8 !important;
      color: #ffffff !important;
      box-shadow: 0 0 18px rgba(56, 189, 248, 0.8), inset 0 0 8px rgba(56, 189, 248, 0.35) !important;
      font-weight: 700;
      transform: scale(1.08);
    }
    .planet-nav-btn.active::after {
      content: '';
      position: absolute;
      bottom: -4px;
      left: 50%;
      transform: translateX(-50%);
      width: 14px;
      height: 3px;
      background: #38bdf8;
      border-radius: 999px;
      box-shadow: 0 0 8px #38bdf8;
    }

    /* Custom Scrollbar */
    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: rgba(2, 4, 10, 0.8);
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.25);
      border-radius: 4px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: rgba(59, 130, 246, 0.7);
    }

    .glow-text {
      text-shadow: 0 0 16px rgba(255, 255, 255, 0.7);
    }
  </style>
</head>

<body class="relative min-h-screen w-full select-none overflow-hidden">

  <!-- Main 3D Canvas Container -->
  <div id="canvas-container" class="absolute inset-0 z-0 cursor-grab active:cursor-grabbing"></div>

  <!-- Header Navigation -->
  <header
    class="absolute top-0 left-0 w-full z-20 p-4 flex flex-wrap justify-between items-center gap-4 bg-gradient-to-b from-black/90 via-black/40 to-transparent">
    <div class="flex items-center space-x-3">
      <div
        class="w-10 h-10 rounded-full bg-gradient-to-tr from-amber-500 via-orange-600 to-indigo-600 flex items-center justify-center shadow-lg shadow-amber-500/40 animate-pulse">
        <i class="fa-solid text-white font-bold text-lg">☉</i>
      </div>
      <div>
        <h1
          class="text-xl md:text-2xl font-black tracking-wider bg-clip-text text-transparent bg-gradient-to-r from-amber-200 via-blue-100 to-cyan-400 glow-text">
          太阳系八大行星 <span
            class="text-xs px-2 py-0.5 rounded-full bg-cyan-500/20 border border-cyan-400/30 text-cyan-300 font-normal">HD
            Ultra</span>
        </h1>
        <p class="text-[11px] text-gray-400 hidden sm:block">超高清纹理 · 真实卫星系统 · 恒星色温星云</p>
      </div>
    </div>

    <!-- Quick Celestial Body Selector -->
    <nav class="flex items-center gap-1.5 overflow-x-auto py-1 px-2 max-w-full glass-panel rounded-full text-xs">
      <button data-planet="Sun" onclick="selectCelestialByName('Sun')"
        class="planet-nav-btn px-3 py-1.5 rounded-full glass-btn text-amber-300 hover:text-amber-100 flex items-center gap-1">
        <span class="w-2.5 h-2.5 rounded-full bg-amber-500 inline-block"></span> 太阳
      </button>
      <div class="w-[1px] h-4 bg-gray-700 mx-1"></div>
      <button data-planet="Mercury" onclick="selectCelestialByName('Mercury')"
        class="planet-nav-btn px-2.5 py-1.5 rounded-full glass-btn hover:text-cyan-300">水星</button>
      <button data-planet="Venus" onclick="selectCelestialByName('Venus')"
        class="planet-nav-btn px-2.5 py-1.5 rounded-full glass-btn hover:text-amber-200">金星</button>
      <button data-planet="Earth" onclick="selectCelestialByName('Earth')"
        class="planet-nav-btn px-2.5 py-1.5 rounded-full glass-btn hover:text-blue-400">地球</button>
      <button data-planet="Mars" onclick="selectCelestialByName('Mars')"
        class="planet-nav-btn px-2.5 py-1.5 rounded-full glass-btn hover:text-red-400">火星</button>
      <button data-planet="Jupiter" onclick="selectCelestialByName('Jupiter')"
        class="planet-nav-btn px-2.5 py-1.5 rounded-full glass-btn hover:text-orange-300">木星</button>
      <button data-planet="Saturn" onclick="selectCelestialByName('Saturn')"
        class="planet-nav-btn px-2.5 py-1.5 rounded-full glass-btn hover:text-yellow-200">土星</button>
      <button data-planet="Uranus" onclick="selectCelestialByName('Uranus')"
        class="planet-nav-btn px-2.5 py-1.5 rounded-full glass-btn hover:text-teal-300">天王星</button>
      <button data-planet="Neptune" onclick="selectCelestialByName('Neptune')"
        class="planet-nav-btn px-2.5 py-1.5 rounded-full glass-btn hover:text-blue-500">海王星</button>
    </nav>
  </header>

  <!-- Left Bottom Controls -->
  <div class="absolute bottom-6 left-6 z-20 flex flex-col gap-3">
    <div class="glass-panel p-1.5 rounded-2xl flex gap-1">
      <button id="btn-mode-orbit" onclick="setViewMode('orbit')"
        class="glass-btn active px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-2">
        <i class="fa-solid fa-circle-nodes"></i> 轨道视角
      </button>
      <button id="btn-mode-grid" onclick="setViewMode('grid')"
        class="glass-btn px-3.5 py-2 rounded-xl text-xs font-semibold flex items-center gap-2">
        <i class="fa-solid fa-border-all"></i> 行星矩阵
      </button>
      <button id="btn-mode-blackhole" onclick="toggleBlackHoleMode()"
        class="glass-btn px-3 py-2 rounded-xl text-xs font-semibold flex items-center gap-1.5 text-purple-400 hover:text-purple-200">
        <i class="fa-solid fa-circle-dot"></i> 黑洞假想
      </button>
    </div>

    <div id="orbit-controls-panel" class="glass-panel p-3 rounded-2xl flex flex-col gap-2.5 max-w-[250px]">
      <div class="text-[11px] text-gray-400 font-medium flex justify-between items-center">
        <span>公转速度</span>
        <span id="speed-label" class="text-cyan-400 font-bold">1x</span>
      </div>
      <div class="flex items-center gap-1.5">
        <button onclick="setSpeed(0)" class="glass-btn p-2 rounded-lg text-xs" title="暂停"><i
            class="fa-solid fa-pause"></i></button>
        <button onclick="setSpeed(0.5)" class="glass-btn px-2 py-1 rounded-lg text-xs">0.5x</button>
        <button onclick="setSpeed(1)" class="glass-btn px-2 py-1 rounded-lg text-xs">1x</button>
        <button onclick="setSpeed(5)" class="glass-btn px-2 py-1 rounded-lg text-xs">5x</button>
        <button onclick="setSpeed(12)" class="glass-btn px-2 py-1 rounded-lg text-xs">12x</button>
      </div>

      <div class="h-[1px] bg-gray-800 my-0.5"></div>

      <!-- Orbit Line Toggle & Scale -->
      <div class="flex justify-between items-center">
        <span class="text-[11px] text-gray-400 font-medium">显示轨道线</span>
        <button id="btn-toggle-orbits" onclick="toggleOrbitLines()"
          class="glass-btn px-2.5 py-1 rounded-lg text-[11px] text-cyan-300">已开启</button>
      </div>
      <div class="flex justify-between items-center">
        <span class="text-[11px] text-gray-400 font-medium">比例模式</span>
        <div class="flex gap-1 text-[11px]">
          <button id="btn-scale-visual" onclick="setScaleMode('visual')"
            class="glass-btn active px-2 py-1 rounded-lg">清晰视觉</button>
          <button id="btn-scale-real" onclick="setScaleMode('real')"
            class="glass-btn px-2 py-1 rounded-lg">对比真实</button>
        </div>
      </div>
    </div>
  </div>

  <!-- Right Top Tools -->
  <div class="absolute top-20 right-6 z-20 flex flex-col items-end gap-2">
    <button id="audio-toggle-btn" onclick="toggleAudio()"
      class="glass-btn w-11 h-11 rounded-full flex items-center justify-center text-gray-300 hover:text-white"
      title="深空环境音效">
      <i id="audio-icon" class="fa-solid fa-volume-xmark text-lg"></i>
    </button>
    <button onclick="resetCameraView()"
      class="glass-btn w-11 h-11 rounded-full flex items-center justify-center text-gray-300 hover:text-white"
      title="重置视角">
      <i class="fa-solid fa-arrows-to-dot text-lg"></i>
    </button>
  </div>

  <!-- Celestial Detail Drawer -->
  <aside id="detail-panel"
    class="absolute top-20 right-6 bottom-6 z-30 w-80 md:w-96 glass-panel rounded-3xl p-6 overflow-y-auto transform translate-x-[120%] transition-transform duration-500 ease-out flex flex-col gap-4">
    <!-- Header -->
    <div class="flex justify-between items-start border-b border-gray-800 pb-3">
      <div>
        <div class="flex items-center gap-2">
          <span id="panel-planet-cn" class="text-2xl font-extrabold text-white glow-text">地球</span>
          <span id="panel-planet-en" class="text-xs uppercase tracking-widest text-cyan-400 font-semibold">Earth</span>
          <span id="panel-badge"
            class="text-[10px] px-2 py-0.5 rounded-full bg-indigo-500/30 text-indigo-300 border border-indigo-400/30">行星</span>
        </div>
        <p id="panel-planet-tagline" class="text-xs text-gray-400 mt-1">我们的蓝色家园，唯一已知的生命摇篮</p>
      </div>
      <button onclick="closeDetailPanel()"
        class="glass-btn w-8 h-8 rounded-full flex items-center justify-center text-gray-400 hover:text-white">
        <i class="fa-solid fa-xmark"></i>
      </button>
    </div>

    <!-- Moons Quick Select Buttons (Injected dynamically) -->
    <div id="moons-selector-container"
      class="hidden flex-col gap-1.5 bg-black/30 p-2.5 rounded-2xl border border-white/5">
      <span class="text-[11px] text-gray-400 font-medium flex items-center gap-1">
        <i class="fa-solid fa-moon text-yellow-400"></i> 主要卫星特写焦点：
      </span>
      <div id="moons-btn-list" class="flex flex-wrap gap-1.5 mt-1">
        <!-- Dynamic moon buttons -->
      </div>
    </div>

    <!-- Data Grid -->
    <div class="grid grid-cols-2 gap-2.5 text-xs">
      <div class="bg-black/30 p-2.5 rounded-2xl border border-white/5">
        <div class="text-gray-400 text-[11px] mb-0.5"><i class="fa-solid fa-arrows-left-right text-amber-400 mr-1"></i>
          平均距离/半径</div>
        <div id="param-distance" class="text-xs font-semibold text-gray-100">1.00 AU</div>
      </div>
      <div class="bg-black/30 p-2.5 rounded-2xl border border-white/5">
        <div class="text-gray-400 text-[11px] mb-0.5"><i class="fa-solid fa-ruler-combined text-indigo-400 mr-1"></i>
          实体直径</div>
        <div id="param-diameter" class="text-xs font-semibold text-gray-100">12,742 km</div>
      </div>
      <div class="bg-black/30 p-2.5 rounded-2xl border border-white/5">
        <div class="text-gray-400 text-[11px] mb-0.5"><i class="fa-solid fa-weight-hanging text-emerald-400 mr-1"></i>
          表面重力</div>
        <div id="param-gravity" class="text-xs font-semibold text-gray-100">9.81 m/s²</div>
      </div>
      <div class="bg-black/30 p-2.5 rounded-2xl border border-white/5">
        <div class="text-gray-400 text-[11px] mb-0.5"><i class="fa-solid fa-circle-notch text-yellow-300 mr-1"></i>
          卫星/系统</div>
        <div id="param-moons" class="text-xs font-semibold text-gray-100">1 颗</div>
      </div>
      <div class="bg-black/30 p-2.5 rounded-2xl border border-white/5">
        <div class="text-gray-400 text-[11px] mb-0.5"><i class="fa-solid fa-rotate-right text-cyan-400 mr-1"></i> 公转周期
        </div>
        <div id="param-orbit-period" class="text-xs font-semibold text-gray-100">365.25 天</div>
      </div>
      <div class="bg-black/30 p-2.5 rounded-2xl border border-white/5">
        <div class="text-gray-400 text-[11px] mb-0.5"><i class="fa-solid fa-arrows-spin text-purple-400 mr-1"></i> 自转周期
        </div>
        <div id="param-rotation" class="text-xs font-semibold text-gray-100">23.9 Hours</div>
      </div>
    </div>

    <!-- Temperature Scale -->
    <div class="bg-black/30 p-2.5 rounded-2xl border border-white/5">
      <div class="text-[11px] text-gray-400 mb-1 flex justify-between">
        <span><i class="fa-solid fa-temperature-half text-red-400 mr-1"></i> 表面平均温度</span>
        <span id="param-temp" class="text-gray-200 font-semibold">15 °C</span>
      </div>
      <div
        class="w-full h-1.5 bg-gradient-to-r from-blue-600 via-green-400 via-amber-400 to-red-600 rounded-full mt-1.5">
      </div>
    </div>

    <!-- Overview Text -->
    <div>
      <h3 class="text-xs uppercase font-bold text-gray-400 tracking-wider mb-1.5 flex items-center gap-1.5">
        <i class="fa-solid fa-book-bookmark text-cyan-400"></i> 天文概览
      </h3>
      <p id="param-overview"
        class="text-xs text-gray-300 leading-relaxed bg-black/20 p-3 rounded-2xl border border-white/5">
        地球是太阳系由内及外的第三颗行星，也是目前已知宇宙中唯一孕育生命的天体。
      </p>
    </div>

    <!-- Fun Facts Section -->
    <div>
      <h3 class="text-xs uppercase font-bold text-gray-400 tracking-wider mb-1.5 flex items-center gap-1.5">
        <i class="fa-solid fa-lightbulb text-amber-300"></i> 核心发现与事实
      </h3>
      <ul id="param-facts" class="text-xs text-gray-300 space-y-1.5">
        <!-- Injected via JS -->
      </ul>
    </div>
  </aside>

  <script>
    /* Ultra HD Procedural Texture Engine */
    function createHighResTexture(type, baseHex) {
      const canvas = document.createElement('canvas');
      canvas.width = 1024;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = baseHex;
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      if (type === 'Sun') {
        // Multi-layer plasma solar flare noise
        for (let i = 0; i < 3000; i++) {
          const x = Math.random() * canvas.width;
          const y = Math.random() * canvas.height;
          const r = Math.random() * 12 + 2;
          ctx.fillStyle = Math.random() > 0.4 ? 'rgba(255,204,0,0.4)' : 'rgba(255,51,0,0.6)';
          ctx.beginPath(); ctx.arc(x, y, r, 0, Math.PI * 2); ctx.fill();
        }
      } else if (type === 'Jupiter') {
        // Jupiter high detail cloud bands & Great Red Spot
        for (let y = 0; y < canvas.height; y++) {
          const noise = Math.sin(y * 0.08) * 40 + Math.cos(y * 0.03) * 30 + (Math.random() - 0.5) * 15;
          ctx.fillStyle = `rgba(${(180 + noise) | 0}, ${(130 + noise * 0.6) | 0}, ${(90 + noise * 0.3) | 0}, 0.8)`;
          ctx.fillRect(0, y, canvas.width, 3);
        }
        // Swirl turbulent bands
        for (let i = 0; i < 80; i++) {
          ctx.fillStyle = 'rgba(255, 235, 205, 0.25)';
          ctx.beginPath();
          ctx.ellipse(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 80 + 20, Math.random() * 10 + 4, Math.random() * 0.3, 0, Math.PI * 2);
          ctx.fill();
        }
        // Iconic Great Red Spot
        ctx.fillStyle = '#b91c1c';
        ctx.beginPath(); ctx.ellipse(650, 320, 70, 45, -0.1, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#f87171';
        ctx.beginPath(); ctx.ellipse(650, 320, 45, 25, -0.1, 0, Math.PI * 2); ctx.fill();
      } else if (type === 'Earth') {
        // Ocean blue base
        ctx.fillStyle = '#1d4ed8'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Deep continents
        ctx.fillStyle = '#15803d';
        for (let i = 0; i < 40; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 90 + 30, 0, Math.PI * 2);
          ctx.fill();
        }
        // Deserts
        ctx.fillStyle = '#d97706';
        for (let i = 0; i < 15; i++) {
          ctx.beginPath();
          ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 40 + 10, 0, Math.PI * 2);
          ctx.fill();
        }
        // Ice caps
        ctx.fillStyle = '#f8fafc';
        ctx.fillRect(0, 0, canvas.width, 35);
        ctx.fillRect(0, canvas.height - 35, canvas.width, 35);
      } else if (type === 'EarthClouds') {
        // Earth Atmosphere Swirl Clouds Canvas
        ctx.fillStyle = 'rgba(0, 0, 0, 0)'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = 'rgba(255, 255, 255, 0.75)';
        for (let i = 0; i < 120; i++) {
          ctx.beginPath();
          ctx.ellipse(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 120 + 30, Math.random() * 15 + 5, Math.random() * 0.5, 0, Math.PI * 2);
          ctx.fill();
        }
      } else if (type === 'Mars') {
        ctx.fillStyle = '#b45309'; ctx.fillRect(0, 0, canvas.width, canvas.height);
        // Craters & Dark basalt plains
        ctx.fillStyle = '#78350f';
        for (let i = 0; i < 60; i++) {
          ctx.beginPath(); ctx.arc(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 50 + 10, 0, Math.PI * 2); ctx.fill();
        }
        // Polar Ice
        ctx.fillStyle = '#fef3c7';
        ctx.fillRect(0, 0, canvas.width, 25);
        ctx.fillRect(0, canvas.height - 25, canvas.width, 25);
      } else {
        // General Craters and noise texture
        for (let i = 0; i < 2000; i++) {
          ctx.fillStyle = `rgba(0,0,0,${Math.random() * 0.25})`;
          ctx.fillRect(Math.random() * canvas.width, Math.random() * canvas.height, Math.random() * 4 + 1, Math.random() * 4 + 1);
        }
      }

      return new THREE.CanvasTexture(canvas);
    }

    /* Saturn Ultra HD Rings Texture */
    function createSaturnRingsTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 1024; canvas.height = 64;
      const ctx = canvas.getContext('2d');

      const grad = ctx.createLinearGradient(0, 0, canvas.width, 0);
      grad.addColorStop(0.00, 'rgba(0,0,0,0)');
      grad.addColorStop(0.15, 'rgba(210,180,140,0.85)');
      grad.addColorStop(0.50, 'rgba(240,220,180,0.95)');
      grad.addColorStop(0.65, 'rgba(10,10,15,0.1)'); // Cassini Division Gap
      grad.addColorStop(0.72, 'rgba(200,170,130,0.75)');
      grad.addColorStop(0.92, 'rgba(160,130,100,0.4)');
      grad.addColorStop(1.00, 'rgba(0,0,0,0)');

      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      return new THREE.CanvasTexture(canvas);
    }
  </script>

  <script>
    let scene, camera, renderer, controls;
    let celestialObjects = {};
    let orbitLinesGroup = new THREE.Group();
    let sunMesh, sunGlowMesh, solarParticles;
    let viewMode = 'orbit';
    let orbitSpeedMultiplier = 1;
    let showOrbitLines = true;
    let scaleMode = 'visual';

    // Audio State
    let audioCtx = null, isAudioPlaying = false, ambientOsc1, ambientOsc2, gainNode;

    window.onload = function () {
      initEngine();
      createStarfieldAndNebula();
      createSunSystem();
      createPlanetsAndMoons();
      setupInteractions();
      animate();
    };

    function initEngine() {
      const container = document.getElementById('canvas-container');

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x02040a, 0.001);

      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 0.1, 2500);
      camera.position.set(0, 60, 150);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true, powerPreference: "high-performance" });
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;

      // Tone mapping for realistic lighting contrast
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.15;

      container.appendChild(renderer.domElement);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxDistance = 600;
      controls.minDistance = 2;

      // Lights
      const ambientLight = new THREE.AmbientLight(0x404050, 1.5);
      scene.add(ambientLight);

      const sunLight = new THREE.PointLight(0xffffff, 2.8, 1200, 0.3);
      sunLight.castShadow = true;
      sunLight.shadow.mapSize.width = 2048;
      sunLight.shadow.mapSize.height = 2048;
      scene.add(sunLight);

      scene.add(orbitLinesGroup);
    }

    /* Starfield with Stellar Temperatures & Dynamic Nebulas */
    function createStarfieldAndNebula() {
      // 1. Multi-Temperature Stars (Blue Giants, Yellow Dwarfs, Red Giants)
      const starGeo = new THREE.BufferGeometry();
      const count = 7000;
      const positions = new Float32Array(count * 3);
      const colors = new Float32Array(count * 3);

      const tempColors = [
        new THREE.Color(0x93c5fd), // O/B Blue
        new THREE.Color(0xffffff), // A/F White
        new THREE.Color(0xfde047), // G Yellow
        new THREE.Color(0xf97316)  // M Red Giant
      ];

      for (let i = 0; i < count; i++) {
        const r = 400 + Math.random() * 800;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);

        positions[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        positions[i * 3 + 1] = r * Math.sin(phi) * Math.sin(theta);
        positions[i * 3 + 2] = r * Math.cos(phi);

        const color = tempColors[Math.floor(Math.random() * tempColors.length)];
        colors[i * 3] = color.r;
        colors[i * 3 + 1] = color.g;
        colors[i * 3 + 2] = color.b;
      }

      starGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      starGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const starMat = new THREE.PointsMaterial({
        size: 1.4, vertexColors: true, transparent: true, opacity: 0.85
      });
      scene.add(new THREE.Points(starGeo, starMat));

      // 2. Cosmic Dust & Nebula Particles
      const nebulaGeo = new THREE.BufferGeometry();
      const nebCount = 1200;
      const nebPos = new Float32Array(nebCount * 3);
      const nebCols = new Float32Array(nebCount * 3);

      for (let i = 0; i < nebCount; i++) {
        const r = 350 + Math.random() * 400;
        const theta = Math.random() * Math.PI * 2;
        const phi = Math.acos((Math.random() * 2) - 1);

        nebPos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
        nebPos[i * 3 + 1] = (r * Math.sin(phi) * Math.sin(theta)) * 0.3; // Flattened disk
        nebPos[i * 3 + 2] = r * Math.cos(phi);

        const col = Math.random() > 0.5 ? new THREE.Color(0x3b82f6) : new THREE.Color(0xa855f7);
        nebCols[i * 3] = col.r; nebCols[i * 3 + 1] = col.g; nebCols[i * 3 + 2] = col.b;
      }
      nebulaGeo.setAttribute('position', new THREE.BufferAttribute(nebPos, 3));
      nebulaGeo.setAttribute('color', new THREE.BufferAttribute(nebCols, 3));

      const nebulaMat = new THREE.PointsMaterial({
        size: 8.0, vertexColors: true, transparent: true, opacity: 0.25, blending: THREE.AdditiveBlending
      });
      scene.add(new THREE.Points(nebulaGeo, nebulaMat));
    }

    /* Create High-Fidelity Sun with Corona & Particles */
    function createSunSystem() {
      const data = CELESTIAL_DATA.Sun;
      const geo = new THREE.SphereGeometry(data.size, 64, 64);
      const tex = createHighResTexture('Sun', '#ffaa00');

      const mat = new THREE.MeshBasicMaterial({ map: tex, color: 0xffbb00 });
      sunMesh = new THREE.Mesh(geo, mat);
      sunMesh.userData = { name: 'Sun' };
      scene.add(sunMesh);

      // Atmospheric Glowing Corona
      const glowGeo = new THREE.SphereGeometry(data.size * 1.2, 32, 32);
      const glowMat = new THREE.MeshBasicMaterial({
        color: 0xff6600, transparent: true, opacity: 0.35, side: THREE.BackSide
      });
      sunGlowMesh = new THREE.Mesh(glowGeo, glowMat);
      scene.add(sunGlowMesh);

      // Solar Wind Ejection Particles
      const pCount = 300;
      const pGeo = new THREE.BufferGeometry();
      const pPos = new Float32Array(pCount * 3);
      for (let i = 0; i < pCount; i++) {
        pPos[i * 3] = (Math.random() - 0.5) * data.size * 2.5;
        pPos[i * 3 + 1] = (Math.random() - 0.5) * data.size * 2.5;
        pPos[i * 3 + 2] = (Math.random() - 0.5) * data.size * 2.5;
      }
      pGeo.setAttribute('position', new THREE.BufferAttribute(pPos, 3));
      const pMat = new THREE.PointsMaterial({ color: 0xffaa00, size: 0.6, transparent: true, opacity: 0.6 });
      solarParticles = new THREE.Points(pGeo, pMat);
      scene.add(solarParticles);

      celestialObjects['Sun'] = { mesh: sunMesh, pivot: new THREE.Group() };
    }

    /* Build Planets and their Sub-Moons */
    function createPlanetsAndMoons() {
      const planetKeys = ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];

      planetKeys.forEach((key) => {
        const data = CELESTIAL_DATA[key];
        const pivot = new THREE.Group();
        scene.add(pivot);

        // Main Planet Mesh
        const geo = new THREE.SphereGeometry(data.size, 64, 64);
        const tex = createHighResTexture(key, `#${data.color.toString(16).padStart(6, '0')}`);

        const mat = new THREE.MeshStandardMaterial({
          map: tex, color: data.color, roughness: 0.6, metalness: 0.1
        });

        const mesh = new THREE.Mesh(geo, mat);
        mesh.castShadow = true; mesh.receiveShadow = true;
        mesh.position.x = data.distance;
        mesh.userData = { name: key };
        pivot.add(mesh);

        // Special Planet Layers (Clouds, Atmosphere Glow, Rings)
        if (key === 'Earth') {
          // Atmosphere Clouds Layer
          const cloudGeo = new THREE.SphereGeometry(data.size * 1.02, 64, 64);
          const cloudTex = createHighResTexture('EarthClouds', '#ffffff');
          const cloudMat = new THREE.MeshStandardMaterial({ map: cloudTex, transparent: true, opacity: 0.4 });
          const cloudMesh = new THREE.Mesh(cloudGeo, cloudMat);
          mesh.add(cloudMesh);
        } else if (key === 'Saturn') {
          // Ultra High-Res Rings
          const ringGeo = new THREE.RingGeometry(data.size * 1.3, data.size * 2.5, 128);
          const ringTex = createSaturnRingsTexture();
          const ringMat = new THREE.MeshStandardMaterial({
            map: ringTex, side: THREE.DoubleSide, transparent: true, opacity: 0.9
          });
          const ringMesh = new THREE.Mesh(ringGeo, ringMat);
          ringMesh.rotation.x = Math.PI / 2 + 0.2;
          mesh.add(ringMesh);
        }

        // Draw Planet Orbit Ring
        const orbitLine = createOrbitRing(data.distance, 0xffffff, 0.15);
        orbitLinesGroup.add(orbitLine);

        // Store Reference
        celestialObjects[key] = {
          mesh: mesh, pivot: pivot, angle: Math.random() * Math.PI * 2,
          distance: data.distance, speed: data.speed, orbitLine: orbitLine, moons: {}
        };

        // Build Moons if available
        if (data.moonsList) {
          data.moonsList.forEach((moonKey) => {
            const moonData = CELESTIAL_DATA[moonKey];
            const moonPivot = new THREE.Group();
            mesh.add(moonPivot); // Attach to parent planet

            const moonGeo = new THREE.SphereGeometry(moonData.size, 32, 32);
            const moonTex = createHighResTexture('Moon', `#${moonData.color.toString(16).padStart(6, '0')}`);
            const moonMat = new THREE.MeshStandardMaterial({ map: moonTex, color: moonData.color, roughness: 0.8 });

            const moonMesh = new THREE.Mesh(moonGeo, moonMat);
            moonMesh.position.x = moonData.distance;
            moonMesh.userData = { name: moonKey, isMoon: true, parent: key };
            moonPivot.add(moonMesh);

            // Moon Orbit Line
            const moonOrbitLine = createOrbitRing(moonData.distance, 0x94a3b8, 0.25);
            moonPivot.add(moonOrbitLine);

            celestialObjects[key].moons[moonKey] = {
              mesh: moonMesh, pivot: moonPivot, angle: Math.random() * Math.PI * 2,
              distance: moonData.distance, speed: moonData.speed
            };
            celestialObjects[moonKey] = { mesh: moonMesh, isMoon: true, parent: key };
          });
        }
      });
    }

    function createOrbitRing(radius, colorHex, opacity) {
      const geo = new THREE.BufferGeometry();
      const points = [];
      const segments = 128;
      for (let i = 0; i <= segments; i++) {
        const theta = (i / segments) * Math.PI * 2;
        points.push(new THREE.Vector3(Math.cos(theta) * radius, 0, Math.sin(theta) * radius));
      }
      geo.setFromPoints(points);
      return new THREE.Line(geo, new THREE.LineBasicMaterial({ color: colorHex, transparent: true, opacity: opacity }));
    }
  </script>

  <script>
    let lockedTarget = null;
    let lastTargetPos = null;
    let lockRingMesh = null;

    function getLockRing() {
      if (!lockRingMesh && typeof scene !== 'undefined') {
        const ringGeo = new THREE.RingGeometry(1, 1.12, 64);
        const ringMat = new THREE.MeshBasicMaterial({
          color: 0x38bdf8,
          side: THREE.DoubleSide,
          transparent: true,
          opacity: 0.85
        });
        lockRingMesh = new THREE.Mesh(ringGeo, ringMat);
        lockRingMesh.visible = false;
        scene.add(lockRingMesh);
      }
      return lockRingMesh;
    }

    function animate() {
      requestAnimationFrame(animate);

      // Rotate Sun and Atmosphere Particles
      if (sunMesh) sunMesh.rotation.y += 0.002;
      if (solarParticles) solarParticles.rotation.y += 0.001;

      if (viewMode === 'orbit') {
        Object.keys(celestialObjects).forEach((key) => {
          const obj = celestialObjects[key];
          if (key === 'Sun' || obj.isMoon) return;

          // Orbit Revolutions
          obj.angle += obj.speed * 0.2 * orbitSpeedMultiplier;
          obj.mesh.position.x = Math.cos(obj.angle) * obj.distance;
          obj.mesh.position.z = Math.sin(obj.angle) * obj.distance;

          // Self Axial Rotation
          obj.mesh.rotation.y += 0.01;

          // Orbit Moons around Parent Planet
          if (obj.moons) {
            Object.keys(obj.moons).forEach((moonKey) => {
              const moon = obj.moons[moonKey];
              moon.angle += moon.speed * 0.5 * orbitSpeedMultiplier;
              moon.mesh.position.x = Math.cos(moon.angle) * moon.distance;
              moon.mesh.position.z = Math.sin(moon.angle) * moon.distance;
              moon.mesh.rotation.y += 0.015;
            });
          }
        });
      }

      // Lock and Track Target Planet smoothly
      const ring = getLockRing();
      if (lockedTarget) {
        const targetWorldPos = new THREE.Vector3();
        let targetSize = 2;
        if (lockedTarget === 'Sun' && sunMesh) {
          targetWorldPos.copy(sunMesh.position);
          targetSize = 10;
        } else if (celestialObjects[lockedTarget] && celestialObjects[lockedTarget].mesh) {
          celestialObjects[lockedTarget].mesh.getWorldPosition(targetWorldPos);
          targetSize = CELESTIAL_DATA[lockedTarget] ? CELESTIAL_DATA[lockedTarget].size : 2;
        }
        controls.target.copy(targetWorldPos);

        if (lastTargetPos) {
          const delta = targetWorldPos.clone().sub(lastTargetPos);
          camera.position.add(delta);
        }
        lastTargetPos = targetWorldPos.clone();

        if (ring) {
          ring.visible = true;
          ring.position.copy(targetWorldPos);
          ring.lookAt(camera.position);
          const scaleVal = targetSize * 1.6 + 0.5;
          ring.scale.set(scaleVal, scaleVal, scaleVal);
          ring.rotation.z += 0.02;
        }
      } else {
        lastTargetPos = null;
        if (ring) ring.visible = false;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    /* Dynamic Camera Track & Select Celestial Object */
    function selectCelestialByName(name) {
      const data = CELESTIAL_DATA[name];
      if (!data) return;

      // Update Top Nav active state
      document.querySelectorAll('.planet-nav-btn').forEach(b => {
        b.classList.remove('active', 'border-cyan-400', 'bg-cyan-500/25', 'text-cyan-300', 'shadow-lg');
      });
      const activeBtn = document.querySelector(`.planet-nav-btn[data-planet="${name}"]`);
      if (activeBtn) {
        activeBtn.classList.add('active', 'border-cyan-400', 'bg-cyan-500/25', 'text-cyan-300', 'shadow-lg');
      }

      // Update Panel Info
      document.getElementById('panel-planet-cn').innerText = data.cnName;
      document.getElementById('panel-planet-en').innerText = data.enName;
      document.getElementById('panel-badge').innerText = data.type;
      document.getElementById('panel-planet-tagline').innerText = data.tagline;
      document.getElementById('param-distance').innerText = data.distFromSun;
      document.getElementById('param-diameter').innerText = data.diameter;
      document.getElementById('param-gravity').innerText = data.gravity;
      document.getElementById('param-moons').innerText = data.moons;
      document.getElementById('param-orbit-period').innerText = data.orbitPeriod;
      document.getElementById('param-rotation').innerText = data.rotation;
      document.getElementById('param-temp').innerText = data.temp;
      document.getElementById('param-overview').innerText = data.overview;

      // Render Sub-Moons Quick Select Buttons if applicable
      const moonsContainer = document.getElementById('moons-selector-container');
      const moonsListBtn = document.getElementById('moons-btn-list');
      moonsListBtn.innerHTML = '';

      if (data.moonsList && data.moonsList.length > 0) {
        moonsContainer.classList.remove('hidden');
        moonsContainer.classList.add('flex');

        data.moonsList.forEach(mKey => {
          const mData = CELESTIAL_DATA[mKey];
          const btn = document.createElement('button');
          btn.className = 'glass-btn px-2.5 py-1 rounded-lg text-[11px] hover:text-cyan-300';
          btn.innerText = mData.cnName;
          btn.onclick = (e) => { e.stopPropagation(); selectCelestialByName(mKey); };
          moonsListBtn.appendChild(btn);
        });
      } else {
        moonsContainer.classList.add('hidden');
        moonsContainer.classList.remove('flex');
      }

      // Render Facts List
      const factsContainer = document.getElementById('param-facts');
      factsContainer.innerHTML = '';
      data.facts.forEach(fact => {
        const li = document.createElement('li');
        li.className = 'bg-black/20 p-2.5 rounded-xl border border-white/5 flex items-start gap-2';
        li.innerHTML = `<span class="text-cyan-400 font-bold">•</span> <span>${fact}</span>`;
        factsContainer.appendChild(li);
      });

      // Show Panel
      document.getElementById('detail-panel').classList.remove('translate-x-[120%]');

      // Focus & Lock Camera Target
      lockedTarget = name;
      lastTargetPos = null;

      if (name === 'Sun') {
        const sunPos = sunMesh ? sunMesh.position.clone() : new THREE.Vector3(0, 0, 0);
        gsapCameraTarget(sunPos, new THREE.Vector3(0, 15, 45));
      } else {
        const obj = celestialObjects[name];
        if (obj && obj.mesh) {
          const worldPos = new THREE.Vector3();
          obj.mesh.getWorldPosition(worldPos);

          const offset = data.size * 3.4 + 5;
          const camTargetPos = new THREE.Vector3(
            worldPos.x + offset * 0.7,
            worldPos.y + offset * 0.4,
            worldPos.z + offset
          );

          gsapCameraTarget(worldPos, camTargetPos);
        }
      }
    }

    function closeDetailPanel() {
      lockedTarget = null;
      lastTargetPos = null;
      if (lockRingMesh) lockRingMesh.visible = false;
      document.querySelectorAll('.planet-nav-btn').forEach(b => {
        b.classList.remove('active', 'border-cyan-400', 'bg-cyan-500/25', 'text-cyan-300', 'shadow-lg');
      });
      document.getElementById('detail-panel').classList.add('translate-x-[120%]');
    }

    function toggleOrbitLines() {
      showOrbitLines = !showOrbitLines;
      orbitLinesGroup.visible = showOrbitLines;
      const btn = document.getElementById('btn-toggle-orbits');
      btn.innerText = showOrbitLines ? '已开启' : '已隐藏';
      btn.classList.toggle('text-cyan-300', showOrbitLines);
    }

    function setViewMode(mode) {
      viewMode = mode;
      document.getElementById('btn-mode-orbit').classList.toggle('active', mode === 'orbit');
      document.getElementById('btn-mode-grid').classList.toggle('active', mode === 'grid');

      if (mode === 'grid') {
        orbitLinesGroup.visible = false;
        const keys = ['Mercury', 'Venus', 'Earth', 'Mars', 'Jupiter', 'Saturn', 'Uranus', 'Neptune'];
        const startX = -75;
        keys.forEach((key, idx) => {
          const obj = celestialObjects[key];
          obj.mesh.position.set(startX + idx * 22, 0, 0);
        });
        if (sunMesh) sunMesh.position.set(-100, 0, 0);
        gsapCameraTarget(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 10, 150));
      } else {
        orbitLinesGroup.visible = showOrbitLines;
        if (sunMesh) sunMesh.position.set(0, 0, 0);
        resetCameraView();
      }
    }

    function setSpeed(spd) {
      orbitSpeedMultiplier = spd;
      document.getElementById('speed-label').innerText = spd === 0 ? '已暂停' : `${spd}x`;
    }

    function setScaleMode(mode) {
      scaleMode = mode;
      document.getElementById('btn-scale-visual').classList.toggle('active', mode === 'visual');
      document.getElementById('btn-scale-real').classList.toggle('active', mode === 'real');

      Object.keys(celestialObjects).forEach((key) => {
        const obj = celestialObjects[key];
        if (obj.mesh && !obj.isMoon && key !== 'Sun') {
          const factor = mode === 'real' ? (key === 'Jupiter' || key === 'Saturn' ? 1.3 : 0.45) : 1.0;
          obj.mesh.scale.setScalar(factor);
        }
      });
    }

    function gsapCameraTarget(targetLookAt, targetCamPos) {
      const startLookAt = controls.target.clone();
      const startCamPos = camera.position.clone();
      let progress = 0;

      function step() {
        progress += 0.04;
        if (progress <= 1) {
          camera.position.lerpVectors(startCamPos, targetCamPos, progress);
          controls.target.lerpVectors(startLookAt, targetLookAt, progress);
          requestAnimationFrame(step);
        } else {
          camera.position.copy(targetCamPos);
          controls.target.copy(targetLookAt);
        }
      }
      step();
    }

    function resetCameraView() {
      closeDetailPanel();
      gsapCameraTarget(new THREE.Vector3(0, 0, 0), new THREE.Vector3(0, 60, 150));
    }

    function setupInteractions() {
      const raycaster = new THREE.Raycaster();
      const mouse = new THREE.Vector2();

      window.addEventListener('click', (e) => {
        if (e.target.closest('header') || e.target.closest('#detail-panel') || e.target.closest('button') || e.target.closest('#orbit-controls-panel')) {
          return;
        }

        mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
        mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;

        raycaster.setFromCamera(mouse, camera);

        const meshes = [];
        Object.keys(celestialObjects).forEach(k => { if (celestialObjects[k].mesh) meshes.push(celestialObjects[k].mesh); });

        const intersects = raycaster.intersectObjects(meshes);
        if (intersects.length > 0) {
          const clicked = intersects[0].object;
          if (clicked.userData && clicked.userData.name) {
            playHudChirp();
            selectCelestialByName(clicked.userData.name);
          }
        }
      });

      window.addEventListener('resize', () => {
        camera.aspect = window.innerWidth / window.innerHeight;
        camera.updateProjectionMatrix();
        renderer.setSize(window.innerWidth, window.innerHeight);
      });
    }

    let isBlackHole = false;
    function playHudChirp() {
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator(), g = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1400, now + 0.08);
        g.gain.setValueAtTime(0.08, now);
        g.gain.linearRampToValueAtTime(0.001, now + 0.08);
        osc.connect(g); g.connect(audioCtx.destination);
        osc.start(); osc.stop(now + 0.09);
      } catch (e) { }
    }

    function toggleBlackHoleMode() {
      isBlackHole = !isBlackHole;
      const btn = document.getElementById('btn-mode-blackhole');
      if (sunMesh) {
        if (isBlackHole) {
          sunMesh.material.color.setHex(0x000000);
          sunMesh.material.emissive.setHex(0x220033);
          btn.classList.add('active');
          btn.innerHTML = '<i class="fa-solid fa-circle-dot"></i> 黑洞模式: 开启';
          if (ambientOsc1) ambientOsc1.frequency.setValueAtTime(32, audioCtx.currentTime);
        } else {
          sunMesh.material.color.setHex(0xffaa00);
          sunMesh.material.emissive.setHex(0xff6600);
          btn.classList.remove('active');
          btn.innerHTML = '<i class="fa-solid fa-circle-dot"></i> 黑洞假想';
          if (ambientOsc1) ambientOsc1.frequency.setValueAtTime(55, audioCtx.currentTime);
        }
      }
    }

    function toggleAudio() {
      const btn = document.getElementById('audio-toggle-btn');
      const icon = document.getElementById('audio-icon');

      if (!isAudioPlaying) {
        if (!audioCtx) {
          audioCtx = new (window.AudioContext || window.webkitAudioContext)();
          ambientOsc1 = audioCtx.createOscillator();
          ambientOsc1.type = 'sine';
          ambientOsc1.frequency.setValueAtTime(55, audioCtx.currentTime);

          ambientOsc2 = audioCtx.createOscillator();
          ambientOsc2.type = 'triangle';
          ambientOsc2.frequency.setValueAtTime(110, audioCtx.currentTime);

          gainNode = audioCtx.createGain();
          gainNode.gain.setValueAtTime(0.06, audioCtx.currentTime);

          ambientOsc1.connect(gainNode);
          ambientOsc2.connect(gainNode);
          gainNode.connect(audioCtx.destination);

          ambientOsc1.start();
          ambientOsc2.start();
        } else {
          audioCtx.resume();
        }
        isAudioPlaying = true;
        btn.classList.add('active');
        icon.className = 'fa-solid fa-volume-high text-lg text-cyan-400';
      } else {
        if (audioCtx) audioCtx.suspend();
        isAudioPlaying = false;
        btn.classList.remove('active');
        icon.className = 'fa-solid fa-volume-xmark text-lg text-gray-300';
      }
    }
  </script>
</body>
